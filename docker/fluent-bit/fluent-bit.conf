[SERVICE]
    Flush          5
    Daemon         Off
    Log_Level      info
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      2020
    storage.type   filesystem
    storage.path   /var/log/flb-storage/
    # Fixed 2026-08-09 (Milestone S; found and verified by the Q3 PoC,
    # docs/KAFKA_AND_INTEGRATIONS_ROADMAP.md Q3 STATUS block,
    # poc/integration_source_suricata_zeek/). Every `tail` [INPUT] below sets
    # `Parser json` but this file never set `Parsers_File`, so a real
    # `fluent/fluent-bit:3.1` container logged
    # "[error] [input:tail:tail.0] parser 'json' is not registered" at boot
    # and every `Parser json` directive was silently never applied -- this
    # config has almost certainly never actually JSON-parsed anything at
    # runtime. `/fluent-bit/etc/parsers.conf` is the image's own bundled
    # default parsers file (already defines a `json` parser) -- confirmed
    # working (no more "not registered" error) in the Q3 PoC's own real run,
    # see poc/integration_source_suricata_zeek/output.txt.
    Parsers_File   /fluent-bit/etc/parsers.conf

# -----------------------------------------------------------------------
# INPUTS
# -----------------------------------------------------------------------

# KronOS backend application logs (JSON structured)
[INPUT]
    Name           tail
    Tag            kronos.backend
    Path           /var/log/kronos/app.log
    Parser         json
    Mem_Buf_Limit  10MB
    Skip_Long_Lines On

# Celery task logs
[INPUT]
    Name           tail
    Tag            kronos.celery
    Path           /var/log/kronos/celery.log
    Parser         json
    Mem_Buf_Limit  5MB
    Skip_Long_Lines On

# Falco runtime alerts
[INPUT]
    Name           tail
    Tag            kronos.falco
    Path           /var/log/falco/falco.log
    Parser         json
    Mem_Buf_Limit  5MB
    Skip_Long_Lines On

# NGINX access log
#
# Real fix, P1-6 (2026-08-14, Milestone V8; volume declared with no real
# producer since Milestone S -- see
# poc/fluent_bit_severity_and_nginx_logs/nginx_access_log/README.md for the
# full real captured verification). Path changed from the previous
# `/var/log/nginx/access.log` -- real, reproduced finding: the official
# `nginx:alpine` base image ships that exact filename as a symlink to
# `/dev/stdout`, which a freshly mounted `nginx_logs` volume copies
# verbatim on first use, so tailing that path would never see a real file.
# `docker/nginx/nginx.conf.template` now writes real JSON access log lines
# (matching this INPUT's own pre-existing `Parser json`, anticipated but
# never fed until this fix) to this new, non-colliding filename instead.
[INPUT]
    Name           tail
    Tag            kronos.nginx
    Path           /var/log/nginx/kronos-access.log
    Parser         json
    Mem_Buf_Limit  10MB
    Skip_Long_Lines On

# -----------------------------------------------------------------------
# FILTERS
# -----------------------------------------------------------------------

# Add correlation metadata to all KronOS logs
#
# Real bug found and fixed 2026-08-09 (Milestone S), confirmed by an actual
# `fluent/fluent-bit:3.1` run against this repo's real dev-stack logs: every
# ${VAR:-default} reference in this file (here and in the OUTPUT blocks
# below) previously used bash-style default-value syntax, which Fluent Bit
# only supports from v5.0.6 onward (real, confirmed via
# github.com/fluent/fluent-bit/releases/tag/v5.0.6 -- "env: add bash-style
# default value operator :-"). Against the pinned 3.1.10, ${KRONOS_CLUSTER:-dev}
# is parsed as a literal (unset) variable name and substitutes to an empty
# string, which broke `record_modifier`'s own config parsing outright at
# boot ("[error] [config map] property 'record' expects 2 values (only 1
# were found)", "Failed initialize filter record_modifier.0",
# "[error] [engine] filter initialization failed") -- every INPUT was paused
# and nothing was ever actually forwarded. Fixed by dropping the
# `:-default` portion everywhere in this file: plain ${VAR} is safe because
# docker-compose.fluent-bit.yml's own `environment:` block already
# guarantees every one of these variables is set inside the container
# (via Compose's own, unrelated, and fully-supported `${VAR:-default}`
# interpolation at the docker-compose.yml level) before Fluent Bit ever
# reads this config.
[FILTER]
    Name           record_modifier
    Match          kronos.*
    Record         cluster   ${KRONOS_CLUSTER}
    Record         env       ${KRONOS_ENV}

# Strip PII fields from backend logs before forwarding to SIEM
[FILTER]
    Name           record_modifier
    Match          kronos.backend
    Remove_key     password
    Remove_key     token
    Remove_key     refresh_token
    Remove_key     client_secret

# Parse audit events — extract event_type for Wazuh routing
[FILTER]
    Name           parser
    Match          kronos.backend
    Key_Name       message
    Parser         json
    Reserve_Data   On
    Preserve_Key   On

# Real fix, P1-5 (2026-08-14, Milestone V8; real bug found and documented at
# Milestone S, real fix built and verified here -- see
# poc/fluent_bit_severity_and_nginx_logs/severity/README.md). The syslog
# OUTPUT below sets `Syslog_Severity_Key level`, telling fluent-bit's own
# syslog plugin to read `level` as the numeric RFC 5424 severity (0-7) to
# send -- but this repo's real structlog-based logger
# (src/external/logging_config.py, structlog.stdlib.add_log_level) emits
# `level` as one of five real keyword strings: "debug"/"info"/"warning"/
# "error"/"critical" (confirmed via `structlog.stdlib.map_method_name`'s own
# source AND a repo-wide grep of every `logger.<method>(` call site --
# "warn" is never actually emitted, since structlog normalizes the
# deprecated `.warn()` alias to "warning" before add_log_level runs, and
# `.exception()` normalizes to "error"). A real `fluent/fluent-bit:3.1.10`
# run confirmed not just the documented "invalid severity" warning but a
# more nuanced, previously-unverified real behavior: fluent-bit's own
# fallback keyword table happens to recognize "debug"/"info"/"warning"
# (RFC 5424's own severity names) and silently gets those three RIGHT
# despite still logging the warning, while "error"/"critical" don't match
# RFC 5424's abbreviated keywords ("err"/"crit") and silently fall back to
# severity 6 -- see the PoC README for the full real captured before/after.
# Fixed with five `modify` filters (verified against the real 3.1.10 binary
# -- `Condition Key_Value_Equals` initializes and evaluates cleanly), each
# translating one real level string to its real RFC 5424 numeric severity
# (RFC 5424 section 6.2.1) into a NEW field, `severity_num` -- chosen over
# rewriting `level` in place so the original string field stays intact for
# the OpenSearch OUTPUTs above, which read `level` directly via the earlier
# `parser` FILTER's `Reserve_Data On`. A `lua` filter was considered and
# rejected: this file is bind-mounted as a single config file (see
# docker-compose.fluent-bit.yml), so a `lua` filter would need a second
# bind-mounted script file for no real benefit over five straightforward
# `modify` blocks.
[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level debug
    Set            severity_num 7

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level info
    Set            severity_num 6

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level warning
    Set            severity_num 4

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level error
    Set            severity_num 3

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level critical
    Set            severity_num 2

# -----------------------------------------------------------------------
# OUTPUTS
# -----------------------------------------------------------------------

# → OpenSearch: KronOS backend/celery structured logs (fluentbit-kronos-audit-* index)
#
# Real bug found live (2026-08-09, Milestone S) and fixed: this OUTPUT
# previously used `Logstash_Prefix kronos-audit`, so every real record
# landed in an index named `kronos-audit-YYYY.MM` -- which matches this
# repo's own real `kronos-template` index template (`index_patterns:
# ["kronos-*"]`, src/adapter/opensearch/index_template.json), a strict-ish
# (`dynamic: false`) ECS-shaped mapping that defines `event` as a nested
# object (ECS `event.category`/`event.action`/etc.). This structured
# logger's own records carry a plain string `event` field (e.g.
# `"event": "startup: dependencies wired"`) -- a real, confirmed
# `mapper_parsing_exception: object mapping for [event] tried to parse
# field [event] as object, but found a concrete value` on every single
# document, captured live via a direct `_bulk` probe against the real
# dev-stack OpenSearch reproducing fluent-bit's exact request. HTTP
# status was a misleading 200 (bulk-level; the real per-item failure is
# only visible in the response body's `errors`/`items[].error`, which
# fluent-bit's own opensearch output correctly treats as a flush failure
# and retries forever, silently, at info log level). Renamed the prefix so
# it no longer matches `kronos-*` and picks up the real ECS template at
# all -- these are raw structured application logs, not further
# KronOS-parsed forensic/ECS timeline data, so they were never meant to
# share that template.
[OUTPUT]
    Name                opensearch
    Match               kronos.backend
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    HTTP_User           ${OPENSEARCH_USERNAME}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     fluentbit-kronos-audit
    Logstash_DateFormat %Y.%m
    Suppress_Type_Name  On
    # Fixed 2026-08-09 (Milestone S): this repo's real OpenSearch service
    # (docker-compose.dev.yml) runs with the security plugin enabled and
    # only serves HTTPS on 9200 (every other real service in dev.yml
    # connects via `https://opensearch:9200` -- OS_BASE/OPENSEARCH_URL/
    # OPENSEARCH_HOSTS). `tls Off` here previously meant this output could
    # never have actually delivered anything to the real dev-stack
    # OpenSearch -- confirmed live: a real `fluent/fluent-bit:3.1` run
    # against it failed with
    # "[error] [http_client] broken connection to opensearch:9200 ?" /
    # "HTTP status=0" until this was flipped to On. `tls.verify Off` is kept
    # (self-signed dev-stack cert, matches OPENSEARCH_SSL_VERIFICATIONMODE
    # -style relaxed verification other dev-stack services already use).
    tls                 On
    tls.verify          Off
    Retry_Limit         5
    Buffer_Size         False

# → OpenSearch: Falco alerts (wazuh-alerts-* index, picked up by Wazuh)
[OUTPUT]
    Name                opensearch
    Match               kronos.falco
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    HTTP_User           ${OPENSEARCH_USERNAME}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     wazuh-alerts
    Logstash_DateFormat %Y.%m
    Suppress_Type_Name  On
    # Same real TLS fix as the kronos-audit OUTPUT above -- see that block's
    # comment.
    tls                 On
    tls.verify          Off
    Retry_Limit         5

# → Wazuh manager syslog input (UDP 514) for real-time SIEM correlation
#
# Real bug found live (2026-08-09, Milestone S) and FIXED for real
# (2026-08-14, Milestone V8 -- see the `modify` FILTER chain above and
# poc/fluent_bit_severity_and_nginx_logs/severity/README.md for the full
# real captured before/after): `Syslog_Severity_Key` now reads the real
# numeric `severity_num` field the FILTER chain above computes, instead of
# the raw `level` keyword string the syslog plugin could never parse as a
# number. Real, previously-unverified nuance found while fixing this: the
# old, broken config didn't uniformly fall back to one default severity --
# fluent-bit's own fallback keyword table happens to recognize "debug"/
# "info"/"warning" (matching RFC 5424's own severity names) and got those
# three right despite still logging "invalid severity", while "error"/
# "critical" don't match RFC 5424's abbreviated keywords ("err"/"crit") and
# silently landed as severity 6 regardless of their real level.
[OUTPUT]
    Name           syslog
    Match          kronos.*
    Host           ${WAZUH_HOST}
    Port           514
    Mode           udp
    Syslog_Format  rfc5424
    Syslog_Severity_Key  severity_num
    Syslog_Appname_Key   service

# → stdout for local debugging (dev only)
[OUTPUT]
    Name           stdout
    Match          kronos.*
    Format         json_lines
