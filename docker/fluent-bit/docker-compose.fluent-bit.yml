version: "3.9"

# Fluent Bit log aggregator — collects KronOS app, Falco, NGINX logs.
# Forwards to OpenSearch and Wazuh.
# Include: docker compose -f docker-compose.dev.yml \
#            -f docker/wazuh/docker-compose.wazuh.yml \
#            -f docker/falco/docker-compose.falco.yml \
#            -f docker/fluent-bit/docker-compose.fluent-bit.yml up

services:
  fluent-bit:
    image: fluent/fluent-bit:3.1
    restart: unless-stopped
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - kronos_app_logs:/var/log/kronos:ro
      - falco_logs:/var/log/falco:ro
      - nginx_logs:/var/log/nginx:ro
      - fluent_storage:/var/log/flb-storage
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      WAZUH_HOST: wazuh-manager
      KRONOS_CLUSTER: dev
      KRONOS_ENV: development
    ports:
      - "2020:2020"   # HTTP monitoring API
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2020/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    # No explicit `networks:` block (2026-08-09 fix, Milestone S -- same
    # drift class as docker/wazuh/docker-compose.wazuh.yml's identical bug,
    # see that file's own comment): this previously required an external
    # network literally named `kronos-internal` that docker-compose.dev.yml
    # never creates (it relies on the implicit project-default network,
    # `docker_default` in this repo's real running dev stack) -- confirmed
    # via `docker compose -f docker-compose.dev.yml -f docker/fluent-bit/docker-compose.fluent-bit.yml config`.
    # Omitting `networks:` joins the implicit default network of whatever
    # compose invocation this file is merged into, so `fluent-bit` can
    # actually reach `opensearch`/`wazuh-manager` by service name.

# `kronos_app_logs`/`falco_logs`/`nginx_logs` are deliberately NOT declared
# here (2026-08-09 fix, Milestone S -- a real, separate drift bug found
# while verifying this file, same class as the network fix above). They
# were previously declared `external: true`, which makes Compose look for a
# pre-existing volume with the exact literal name `kronos_app_logs` etc. --
# but Compose auto-prefixes volume names with the project name
# (`docker_kronos_app_logs` in this repo's real running dev stack, project
# `docker`), so no volume literally named `kronos_app_logs` has ever
# existed; `docker compose up` with this file would have failed at runtime
# with "external volume kronos_app_logs not found". This file's own header
# comment documents the correct usage as always including
# docker-compose.dev.yml (which declares `kronos_app_logs` canonically,
# non-external) and docker/falco/docker-compose.falco.yml (which declares
# `falco_logs` the same way) in the *same* `docker compose ... up`
# invocation -- when that's true, Compose's own multi-file merge already
# resolves both volumes correctly without any redeclaration here.
# `nginx_logs` has no real producer anywhere in this repo today (the
# `nginx` service in docker-compose.dev.yml does not mount or write to any
# such volume) -- declared here as a plain, non-external volume so `up`
# does not fail, but the `kronos.nginx` INPUT in fluent-bit.conf has no
# real data source until nginx itself is wired to write access.log to a
# shared volume. Flagged, not fixed here -- out of Milestone S's scope
# (nginx access logging was never part of the Q3/fluent-bit gap this pass
# was chartered to fix).
volumes:
  nginx_logs:
  fluent_storage:
