# Gap Audit 2026-08-28 -- see docker-compose.dev.yml's own matching
# comment for the full real, verified finding (both files defaulted to
# the identical Compose project name "docker", a real container-collision
# hazard, not hypothetical). Disjoint name from dev's `kronos-dev`.
name: kronos-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kronos_test
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos_test_password
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos -d kronos_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kronos_minio
      MINIO_ROOT_PASSWORD: kronos_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  opensearch:
    # Security genuinely enabled (Gap Audit P1-14 / V3) -- was
    # DISABLE_SECURITY_PLUGIN=true, which defeated the whole A3
    # tenant-isolation model (OpenSearch DLS keyed on a Keycloak-issued
    # org_id claim) for every test that ran against this file. Kept at
    # 2.13.0 (this file's own already-pinned version, not backported to
    # dev's 2.11.1) per CLAUDE.md §F.2 step 1 -- re-verified for real
    # against 2.13.0 specifically in poc/ci_security_enabled_stack/
    # (provision_opensearch_security.py's securityconfig/roles/rolesmapping
    # REST calls are confirmed to behave the same as on the 2.11.1 dev
    # cluster they were originally verified against -- see that PoC's
    # README for the real run).
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Same real, reproduced requirement as docker-compose.dev.yml's
      # opensearch service: the security plugin's bundled demo installer
      # needs to append its own transport-SSL cert paths, and this
      # permission-gate setting (translated by the real entrypoint script
      # into a JVM -E override, not a config-file edit) is the one
      # necessary setting beyond the demo installer's own defaults for
      # opensearch-init's own securityconfig PUT to be accepted afterward.
      - plugins.security.unsupported.restapi.allow_securityconfig_modification=true
      # Real, reproduced, VERSION-SPECIFIC finding (poc/ci_security_enabled_stack/):
      # OpenSearch 2.12.0+ security plugin's demo installer refuses to start
      # at all ("No custom admin password found... please provide a password
      # via OPENSEARCH_INITIAL_ADMIN_PASSWORD") without this -- a breaking
      # change vs. the 2.11.1 dev.yml pins, which needs no such var. Missing
      # this crashes the container on every boot (exit 1), confirmed via
      # `docker logs`. Must satisfy OpenSearch's own strength validator
      # (>=8 chars, upper+lower+digit+special) or the same installer refuses
      # to start with a *different* "password too simple" error (reproduced
      # trying "admin" here first). Every OS_ADMIN_PASSWORD/OPENSEARCH_PASSWORD
      # below must stay in lockstep with this value.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=KronOSCiTest#2026
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      # -k -u: the security plugin's bundled demo config enables HTTPS with
      # a self-signed cert and requires real credentials -- a bare
      # unauthenticated http:// probe (the old healthcheck, from when
      # DISABLE_SECURITY_PLUGIN=true) always fails once security is
      # genuinely on. Same real, working probe as docker-compose.dev.yml,
      # updated for the real 2.13.0-required admin password above.
      test: ["CMD-SHELL", "curl -sk -u admin:KronOSCiTest#2026 -f https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Adds the openid authc domain (trusting Keycloak) and the generic DLS
  # tenant role to OpenSearch's security config, once OpenSearch itself is
  # healthy. Real, unmodified production script -- same one dev/prod use.
  # Verified for real against this file's own 2.13.0 pin in
  # poc/ci_security_enabled_stack/ (Gap Audit P1-14 / V3).
  opensearch-init:
    image: python:3.12-alpine
    depends_on:
      opensearch: { condition: service_healthy }
    restart: "no"
    volumes:
      - ../scripts/provision_opensearch_security.py:/provision_opensearch_security.py:ro
    environment:
      OS_BASE: https://opensearch:9200
      OS_ADMIN_USER: admin
      OS_ADMIN_PASSWORD: KronOSCiTest#2026
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
    entrypoint: ["python3", "/provision_opensearch_security.py"]

  # Gap Audit III (2026-08-28, poc/test_stack_frontend_https/): real,
  # throwaway self-signed cert (SAN=kronos.local only -- the sole
  # authorized domain, poc/tls_lan_https/README.md) for the new `nginx`
  # service below. Not step-ca (docker-compose.dev.yml's own tls-init) --
  # a second step-ca instance is unneeded complexity for a CI/test-only
  # profile; frontend/e2e/playwright.config.ts already sets
  # `ignoreHTTPSErrors: true` globally, so cert *validity* was never going
  # to matter, only that HTTPS is genuinely served at the fixed path
  # (/etc/kronos/tls/server.{crt,key}) nginx-lan-https.conf.template
  # hardcodes.
  tls-init:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout /certs/server.key -out /certs/server.crt \
          -subj "/CN=kronos.local" \
          -addext "subjectAltName=DNS:kronos.local"
        chmod 0644 /certs/server.crt /certs/server.key
    volumes:
      - fe_tls_certs:/certs

  # Gap Audit III: real, shared, unmodified nginx-lan-https.conf.template
  # (baked into docker/Dockerfile.frontend) statically proxy_passes to
  # opensearch-dashboards:5601, and nginx fails HARD at config-parse time
  # if that hostname doesn't resolve at all -- not just at request time
  # (confirmed live, poc/test_stack_frontend_https/output.txt). This
  # profile's own stated purpose is CI/backend-integration testing, not
  # dev-parity -- a full, real, SSO-integrated Dashboards instance
  # (docker-compose.dev.yml's own opensearch-dashboards service, itself a
  # whole dedicated PoC's worth of real Keycloak-openid wiring,
  # poc/opensearch_dashboards_sso/) is disproportionate scope for a
  # config-load-time DNS dependency nothing in this file's own test
  # coverage exercises. Honest, documented trade-off, not a silent gap:
  # a minimal DNS-resolvable stub, not a real Dashboards. Revisit with a
  # real service if/when docs/PLAYWRIGHT_E2E_TEST_PLAN.md §3.6 (dashboards
  # embed spec) is actually built against this profile.
  opensearch-dashboards:
    image: nginx:alpine

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    # Milestone JJJ superseded the reasoning that used to be here (which
    # claimed leaving KC_HOSTNAME unset "correctly and independently
    # supports both" the pytest suite's direct :8080 access and real
    # browser traffic via nginx :8443, "verified live"). That claim was
    # WRONG -- it was verified only up to the login redirect, not the
    # backend's own subsequent refresh-token redemption. A real live run
    # of login.spec.ts against this exact profile reproduced Keycloak
    # rejecting kronos-backend's /auth/refresh redemption with
    # REFRESH_TOKEN_ERROR "Invalid token issuer. Expected
    # 'http://keycloak:8080/realms/kronos'": with no KC_HOSTNAME pinned,
    # Keycloak derives `iss` per-request, so a token minted via the
    # browser's nginx :8443 path (iss=kronos.local:8443) is rejected when
    # kronos-backend redeems it via the internal keycloak:8080 path
    # (iss=keycloak:8080) -- the exact same class of bug
    # docker-compose.dev.yml's own KC_HOSTNAME comment already documented
    # for the dev stack. Fixed the same way dev does it: KC_HOSTNAME
    # pinned + KC_PROXY_HEADERS + KC_HOSTNAME_BACKCHANNEL_DYNAMIC below.
    # This reintroduces the *other* real risk the old comment correctly
    # identified -- tests/integration/test_security_enabled_stack.py's
    # own password-grant tokens (minted via a direct :8080 call) would
    # now ALSO carry the pinned kronos.local:8443 issuer, mismatching
    # that test's old `issuer=f"{KRONOS_SECURITY_STACK_KC_BASE}/realms/
    # kronos"` (built from KC_BASE=http://localhost:8080, never
    # Keycloak's own truth). Fixed at the source instead of avoided here:
    # that test now reads the issuer from Keycloak's own discovery
    # document rather than assuming KC_BASE equals it -- correct
    # regardless of whether KC_HOSTNAME is pinned, see that file's own
    # comment. Both fixes verified live this same pass (JJJ milestone doc).
    environment:
      KC_DB: dev-mem
      # KC_BOOTSTRAP_ADMIN_* (not the deprecated KEYCLOAK_ADMIN* names,
      # which Keycloak 26 warns on and a future major will remove) --
      # aligned with docker-compose.dev.yml's already-fixed keycloak
      # service.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_FEATURES: organization,token-exchange
      # Expose /health/* on the management port (9000); without this the
      # health endpoints 404 and the healthcheck below never passes (same
      # gotcha documented in docker-compose.dev.yml's keycloak service).
      KC_HEALTH_ENABLED: "true"
      # Pin Keycloak's canonical issuer/frontend URL -- mirrors
      # docker-compose.dev.yml's own keycloak service exactly (see that
      # file's comment for the original reasoning). Without it, a
      # browser-minted refresh token (iss=whatever Host the browser used,
      # via nginx :8443) is rejected when kronos-backend redeems it via
      # the internal keycloak:8080 short-circuit -- reproduced live as a
      # real REFRESH_TOKEN_ERROR "Invalid token issuer" (Milestone JJJ).
      # Must exactly match kronos-backend's KEYCLOAK_PUBLIC_URL below.
      KC_HOSTNAME: https://kronos.local:8443
      # Standard Keycloak reverse-proxy setting -- trusts X-Forwarded-*
      # from the nginx :8443 proxy in front of it. Real, reproduced
      # finding: nginx-lan-https.conf.template already sends correct
      # X-Forwarded-Proto/Host/Port headers, but without this, Keycloak
      # doesn't trust/use them when constructing absolute URLs it embeds
      # in its own responses -- confirmed live: the real hosted login
      # form's submit action came back pointing at the WRONG origin
      # (the frontend's own :443 port, not Keycloak's :8443 proxy port),
      # and the browser's real POST to it got a real nginx 400 ("plain
      # HTTP request was sent to HTTPS port"). Safe for the existing pytest
      # suite's own direct :8080 calls (no proxy involved, no
      # X-Forwarded-* headers present, Keycloak falls back to its own raw
      # connection view exactly as before) -- this only changes behavior
      # for requests that actually arrive via nginx's real proxy headers.
      KC_PROXY_HEADERS: xforwarded
      # Keeps `token_endpoint` (and other backchannel-only discovery-doc
      # URLs) resolving per-requester instead of the pinned KC_HOSTNAME,
      # while the actual `iss` claim on issued tokens stays pinned
      # (verified directly against a real Keycloak 26.2 -- see
      # docker-compose.dev.yml's own comment for the reproduction this
      # was ported from). Not currently load-bearing for this profile the
      # way it is for dev's Dashboards SSO, but keeps this service
      # consistent with dev's proven config rather than a partial copy.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8080:8080"]
    volumes:
      # This file never existed in the repo (was "realm-export.json") --
      # docker/keycloak/kronos-realm.json is the real, single-source-of-truth
      # realm export already used by dev/prod; confirmed importing it
      # unmodified into a real Keycloak 26.2 (this service's pinned version,
      # standardized across dev/test) succeeds (poc/README.md's findings doc).
      - ./keycloak/kronos-realm.json:/opt/keycloak/data/import/kronos-realm.json:ro
    healthcheck:
      # The Keycloak 26 image ships no curl/wget, and /health lives on the
      # management port 9000 (not 8080) -- curl against 8080/health, as this
      # previously read, could never succeed either way. Same real, working
      # probe as docker-compose.dev.yml's keycloak service.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 20s
      timeout: 10s
      retries: 10

  # Creates the kronos-test organization via the Admin REST API and links
  # the three realm-imported users (docker/keycloak/kronos-realm.json). The
  # org is NOT in the realm import because Keycloak 26.2 cannot import an
  # organizations block (see scripts/provision_keycloak_org.sh's own
  # docstring). Real, unmodified production script/image -- same one
  # dev/prod use (docker/init/Dockerfile.keycloak-init). Gap Audit P1-14 / V3.
  keycloak-init:
    build:
      context: ..
      dockerfile: docker/init/Dockerfile.keycloak-init
    depends_on:
      keycloak: { condition: service_healthy }
    restart: "no"
    environment:
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: admin
      ORG_NAME: KronOS CI Test
      ORG_ALIAS: kronos-test
      ORG_DESCRIPTION: CI security-enabled test organization
      ORG_DOMAIN: kronos-test.local
      ORG_MEMBER_IDS: "10000000-0000-4000-8000-000000000001 10000000-0000-4000-8000-000000000002 10000000-0000-4000-8000-000000000003"

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Real schema migrations (Gap Audit P1-12 / Milestone V4) -- see
  # docker-compose.dev.yml's identical `db-migrate` service for the full
  # rationale (one-shot init step mirroring keycloak-init/opensearch-init,
  # replacing create_tables() as the schema source of truth).
  db-migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:kronos_test_password@postgres:5432/kronos_test
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: alembic upgrade head

  kronos-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:kronos_test_password@postgres:5432/kronos_test
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: kronos_minio
      MINIO_SECRET_KEY: kronos_minio_password
      # Gap Audit P1-14 / V3: OpenSearch security is now genuinely enabled
      # above (was DISABLE_SECURITY_PLUGIN=true) -- these three were never
      # set before, so this container previously could not even boot
      # against a real security-enabled OpenSearch (opensearch_username/
      # opensearch_password are required, no-default fields in
      # src/config.py::Settings) and, before this fix, silently never
      # called ensure_generic_tenant_role() at all (opensearch_security_enabled
      # defaults to False). admin/admin matches opensearch-init's own
      # OS_ADMIN_USER/PASSWORD above (the bundled security-plugin demo
      # superuser), same convention as docker-compose.dev.yml.
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: KronOSCiTest#2026
      OPENSEARCH_SECURITY_ENABLED: "true"
      # Gap Audit III (2026-08-28): KEYCLOAK_ISSUER/KEYCLOAK_JWKS_URL (this
      # block's own prior contents) are DEAD -- confirmed by reading the
      # real code: src/external/fastapi_app.py's module-level bootstrap
      # reads `KEYCLOAK_PUBLIC_URL`/`KEYCLOAK_URL` directly via os.getenv
      # to DERIVE the issuer/JWKS URL itself (`{public_url}/realms/{realm}`,
      # `{internal_url}/realms/{realm}/protocol/openid-connect/certs`) --
      # it never reads a var named KEYCLOAK_ISSUER or KEYCLOAK_JWKS_URL at
      # all. This means kronos-backend's real JWT validation has never
      # actually been configured correctly in this file, at any point
      # before this fix -- a real, latent bug, not something this pass
      # introduced. KEYCLOAK_URL (internal, JWKS fetch) already added in
      # Milestone HHH; KEYCLOAK_PUBLIC_URL (browser-visible issuer) is new
      # here, needed now that real browser-issued tokens via the nginx
      # service below carry iss=https://kronos.local:8443/... (Keycloak's
      # own per-request dynamic issuer, no KC_HOSTNAME pinning -- see that
      # service's own comment).
      KEYCLOAK_PUBLIC_URL: https://kronos.local:8443
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Gap Audit HHH (2026-08-28, poc/test_stack_frontend_https/): this
      # service has NEVER fully booted in this file -- src/config.py::Settings
      # requires keycloak_url/keycloak_client_secret/vault_url/vault_token/
      # celery_broker_url/celery_result_backend with no default, and none
      # of the six were ever set here. wire_dependencies_async() catches
      # the failure and logs a WARNING rather than crashing at startup, so
      # this was never caught by anything that only checks "does Uvicorn
      # start" -- but src/external/routes/auth.py's /auth/refresh
      # instantiates a fresh Settings() PER REQUEST, so this is a genuine,
      # reproduced 500 on every real token refresh, not a cosmetic startup
      # warning (confirmed live: poc/test_stack_frontend_https/output.txt).
      # keycloak_url/client_secret use this file's own already-real
      # keycloak/keycloak-init services; celery_broker_url/result_backend
      # reuse the real redis already here (DB1/DB2, matching
      # docker-compose.dev.yml's pre-DB-role-split convention -- this file
      # has no dedicated Celery redis instance). vault_url/token are
      # syntactically-valid placeholders only -- this file has no real
      # Vault service (unlike docker-compose.dev.yml, which optionally
      # layers in docker/vault/docker-compose.vault.yml) -- confirmed live
      # that nothing in a login/auth-only flow actually calls Vault, but a
      # real evidence-upload integration test added later would need the
      # real service, not this placeholder.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: kronos-backend-secret
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: unused-placeholder-no-real-vault-service-in-this-file
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      opensearch-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
    command: uvicorn src.external.fastapi_app:app --host 0.0.0.0 --port 8000

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:kronos_test_password@postgres:5432/kronos_test
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: kronos_minio
      MINIO_SECRET_KEY: kronos_minio_password
      # See kronos-backend's identical comment above -- same real,
      # previously-unset-and-unbootable-against-real-security fields.
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: KronOSCiTest#2026
      OPENSEARCH_SECURITY_ENABLED: "true"
      # Gap Audit HHH -- see kronos-backend's identical, fuller comment
      # above. celery_app.py instantiates Settings() at import, so this
      # worker has never been able to boot at all in this file (a harder
      # failure than kronos-backend's own "logs a warning" degradation).
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: kronos-backend-secret
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: unused-placeholder-no-real-vault-service-in-this-file
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      opensearch-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
    command: celery -A src.external.celery_app worker -Q q.parse.fast,q.index -c 4

  # RFC 3161 TSA — real openssl-`ts`-backed responder for testing
  # chain-of-custody timestamping. `freetsa/freetsa:latest` (the image this
  # replaced) does not exist on Docker Hub -- confirmed via the real Docker
  # Hub API, the freetsa namespace has zero repositories -- so this service
  # could never actually start. See docker/init/Dockerfile.tsa-mock and
  # poc/rfc3161/README.md for the real, captured proof this responder
  # round-trips correctly against the production RFC3161TimestampService.
  tsa:
    build:
      context: ..
      dockerfile: docker/init/Dockerfile.tsa-mock
    ports: ["318:318"]
    healthcheck:
      # Real bug found while verifying this against a real `docker compose
      # run`: `localhost` resolves to `::1` first inside this container, but
      # the Python responder only binds IPv4 (`0.0.0.0`) -- `wget
      # http://localhost:318/` gets a real connection-refused every time,
      # `http://127.0.0.1:318/` succeeds. Explicit IPv4 loopback, not a
      # hostname, avoids depending on this image's IPv6/IPv4 resolution
      # order at all.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:318/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NGINX reverse proxy — serves frontend SPA and proxies /api/ to backend
  # Gap Audit III: previously the stock nginx:alpine image (API-proxy-only
  # on :80, no frontend SPA served at all -- confirmed live,
  # poc/test_stack_frontend_https/output.txt). Rebuilt from the same real
  # image docker-compose.dev.yml's own nginx service builds
  # (docker/Dockerfile.frontend), which bakes the compiled SPA in and
  # already includes BOTH nginx.conf.template (:80) and
  # nginx-lan-https.conf.template (real TLS termination on :443/:8443 +
  # Keycloak/backend reverse-proxying) -- no template bind-mount needed at
  # all, unlike the prior stock-image service. Standard ports (443/8443),
  # not the locally-remapped ones poc/test_stack_frontend_https/ used for
  # verification on this host (which already runs docker-compose.dev.yml
  # on those exact ports) -- a real GitHub Actions runner has no
  # conflicting stack; local verification on a host with a live dev stack
  # needs its own port-remap override, matching
  # poc/ci_security_enabled_stack/docker-compose.override.yml's own
  # established pattern.
  nginx:
    image: kronos-test-nginx:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_KEYCLOAK_URL: https://kronos.local:8443
    ports: ["80:80", "443:443", "8443:8443"]
    # See docker/nginx/nginx.conf.template / nginx-lan-https.conf.template
    # — nginx's docker-entrypoint envsubst step renders these into BOTH
    # templates' CSP headers at startup (envsubst applies one shared
    # environment across every *.template file, so the :80 and :443/:8443
    # blocks necessarily share these same values -- matching
    # docker-compose.dev.yml's own nginx service, which does the same).
    environment:
      KEYCLOAK_PUBLIC_URL: "https://kronos.local:8443"
      BACKEND_PUBLIC_URL: "https://kronos.local"
      MINIO_PUBLIC_URL: ""
      OPENSEARCH_DASHBOARDS_URL: ""
    volumes:
      - fe_tls_certs:/etc/kronos/tls:ro
    depends_on:
      kronos-backend:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
      opensearch-dashboards:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
  fe_tls_certs:
