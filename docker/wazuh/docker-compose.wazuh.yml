version: "3.9"

# Wazuh SIEM stack — manager + dashboard.
# IMPORTANT (corrected 2026-08-09, Milestone S -- see
# docs/KAFKA_AND_INTEGRATIONS_ROADMAP.md Q2/S STATUS blocks): there is no
# Wazuh 5.1 release line. The previous "Must use Wazuh >=5.1" pin here
# (5.1.0) does not exist on Docker Hub -- verified against the real tag
# list (newest is 5.0.0-beta4) and the real Wazuh GitHub Releases API
# (newest stable is v4.14.7). The real CVE this comment was trying to avoid
# (GHSA-ff9g-85jq-r3g3, CVSS-10, in 5.0's inventory_sync module) is fixed in
# 5.0.0-beta3 -- it never shipped in any 4.x release, so 4.14.7 (the
# current stable line, predating the CVE'd subsystem entirely) is the
# correct real pin, not merely a fallback. Separately: Wazuh 5.x has
# already removed wazuh-integratord/ossec.conf entirely (verified by direct
# inspection of wazuh/wazuh-manager:5.0.0-beta4), which is the mechanism
# src/external/integration_sources/wazuh.py's WazuhPushSource depends on
# (see poc/integration_source_wazuh/) -- so 4.14.7 is required for that
# connector to work at all, not just for CVE avoidance.
# Include: docker compose -f docker-compose.dev.yml -f docker/wazuh/docker-compose.wazuh.yml up

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    restart: unless-stopped
    hostname: wazuh-manager
    environment:
      WAZUH_API_USER: wazuh-wui
      # No hardcoded fallback (INFRA-015) — a well-known default password is
      # worse than a loud startup failure. Set WAZUH_API_PASSWORD in a local
      # .env file (see docker/.env.example) to keep this usable for dev.
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in your .env file}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - wazuh_filebeat_etc:/etc/filebeat
      - wazuh_filebeat_var:/var/lib/filebeat
      - ./wazuh/etc/kronos-rules.xml:/var/ossec/etc/rules/kronos-rules.xml:ro
      - ./wazuh/etc/kronos-decoders.xml:/var/ossec/etc/decoders/kronos-decoders.xml:ro
    ports:
      - "1514:1514/udp"    # Wazuh agent (UDP)
      - "1515:1515"        # Wazuh agent enrollment
      - "514:514/udp"      # Syslog
      - "55000:55000"      # Wazuh API
    # No explicit `networks:` block (2026-08-09 fix, Milestone S): this
    # file previously required an external network literally named
    # `kronos-internal`, which was never created by docker-compose.dev.yml
    # or any other compose file in this repo (dev.yml relies on the
    # implicit project-default network) -- confirmed via
    # `docker compose -f docker-compose.dev.yml -f docker/wazuh/docker-compose.wazuh.yml config`,
    # which resolved `kronos-internal` as `external: true` with nothing to
    # attach to; `docker compose up` would have failed at runtime with
    # "network kronos-internal not found". Omitting `networks:` here joins
    # the implicit default network of whatever compose invocation this file
    # is merged into (`docker_default` when run with docker-compose.dev.yml
    # from this repo's real dev stack), matching every other real service in
    # docker-compose.dev.yml.

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    restart: unless-stopped
    environment:
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      WAZUH_API_URL: https://wazuh-manager
      WAZUH_API_PORT: 55000
      WAZUH_API_USER: wazuh-wui
      # No hardcoded fallback (INFRA-015) — a well-known default password is
      # worse than a loud startup failure. Set WAZUH_API_PASSWORD in a local
      # .env file (see docker/.env.example) to keep this usable for dev.
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in your .env file}
    ports:
      - "5602:5601"   # Separate port from main OpenSearch Dashboards
    depends_on:
      - wazuh-manager

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  wazuh_filebeat_etc:
  wazuh_filebeat_var:
