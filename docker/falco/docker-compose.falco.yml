version: "3.9"

# Falco runtime security — detects anomalous container behaviour.
# Requires privileged mode + /dev, /proc, /sys mounts for kernel driver.
# NOT for production Kubernetes — use Falco Helm chart with eBPF driver there.
# Include: docker compose -f docker-compose.dev.yml -f docker/falco/docker-compose.falco.yml up

services:
  falco:
    image: falcosecurity/falco-no-driver:0.38.2
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    # Fixed 2026-08-09 (Milestone S): this file previously had two separate
    # `volumes:` mapping keys under this one service (a real YAML duplicate-
    # key error -- `docker compose ... config` failed outright with
    # "mapping key 'volumes' already defined at line 15" before this fix,
    # meaning this overlay could never have actually been brought up
    # together with docker-compose.dev.yml). Merged into the single list
    # below (the second block's own `falco_logs` mount kept, since without
    # it falco's own `--output-file=/var/log/falco/falco.log` target
    # wouldn't be on a shared volume fluent-bit could tail).
    volumes:
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./falco/kronos_rules.yaml:/etc/falco/rules.d/kronos_rules.yaml:ro
      - falco_logs:/var/log/falco
    environment:
      HOST_ROOT: /host
    command:
      - /usr/bin/falco
      - --modern-bpf
      - --json-output
      - --output-route=file
      - --output-file=/var/log/falco/falco.log
    healthcheck:
      test: ["CMD-SHELL", "pgrep falco || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  falco_logs:
