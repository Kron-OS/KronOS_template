services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kronos
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kronos_dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      # -h 127.0.0.1 forces a TCP check: during first-time initdb the bootstrap
      # server listens only on the unix socket, so a socket-based pg_isready
      # reports healthy before :5432 accepts connections, and dependents
      # (backend/celery) then fail wiring with "Connect call failed ... 5432".
      # start_period covers first-init (initdb + bootstrap + restart, ~45s on a
      # fresh volume) during which the TCP check legitimately fails — without it
      # the retries are exhausted before the real server is ready.
      test: ["CMD-SHELL", "pg_isready -U kronos -d kronos -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kronos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      # Browsers PUT evidence directly to MinIO (presigned URLs), which is
      # cross-origin whenever the app and MinIO are on different ports (e.g.
      # http://localhost vs http://localhost:9000 in dev). MinIO's S3-style
      # PutBucketCors bucket API returns "NotImplemented" on this image —
      # CORS here is a server-level setting instead. Must match the origins
      # in CORS_ALLOWED_ORIGINS on kronos-backend below.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost,http://localhost:5173,http://localhost:4173"
    volumes:
      - minio_dev_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    # Pinned to 2.11.1 (not 2.13.0) for dev: DISABLE_SECURITY_PLUGIN=true is
    # broken upstream from 2.12.0 onward (opensearch-project/security#4062 /
    # opensearch-build#4599) — the security plugin stays partially active
    # despite the flag, so unauthenticated calls (including Dashboards'
    # /_plugins/_security/api/account probe) get rejected with 400 instead of
    # the plugin being fully bypassed. 2.11.1 predates the regression and is
    # the last version where a fully-disabled security plugin works as
    # documented. Keep in sync with opensearch-dashboards below.
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_dev_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    # See version note on the opensearch service above — must stay matched
    # to the OpenSearch server version.
    image: opensearchproject/opensearch-dashboards:2.11.1
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  keycloak:
    # 26.2 (not 26.0): the organization-id token claim (addOrganizationId) the
    # backend's _extract_tenant requires only lands in 26.1+. Keep in sync with prod.
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_DB: dev-mem
      # KC_BOOTSTRAP_ADMIN_* (not the deprecated KEYCLOAK_ADMIN* names, which
      # Keycloak 26 warns on and a future major will remove). Same bootstrap
      # admin, current variable names.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_FEATURES: organization,token-exchange
      # Expose /health/* on the management port (9000). Without this the health
      # endpoints return 404 and the healthcheck below never passes.
      KC_HEALTH_ENABLED: "true"
      # Pin Keycloak's canonical issuer/frontend URL so it's stable regardless
      # of which Host a request arrives on (browser via localhost:8080, backend
      # /auth/refresh + keycloak-init via internal keycloak:8080). Without it,
      # start-dev derives the issuer per-request, so a browser-minted refresh
      # token (iss=localhost:8080) is rejected when the backend redeems it via
      # keycloak:8080 -> 401 invalid_token on /auth/refresh.
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./keycloak/kronos-realm.json:/opt/keycloak/data/import/kronos-realm.json:ro
    ports: ["8080:8080"]
    healthcheck:
      # The Keycloak 26 image ships no curl/wget, and /health lives on the
      # management port 9000 (not 8080). Use bash's /dev/tcp (bash is present;
      # kc.sh is a bash script) to probe GET /health/ready and match "200 OK".
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Creates the kronos-dev organization via the Admin REST API and links the
  # three dev users. The org is NOT in the realm import because Keycloak 26.2
  # cannot import an organizations block. Uses the shared provisioning script
  # (scripts/provision_keycloak_org.sh) so dev/prod/Helm stay in sync.
  keycloak-init:
    image: curlimages/curl:latest
    depends_on:
      keycloak: { condition: service_healthy }
    restart: "no"
    volumes:
      - ../scripts/provision_keycloak_org.sh:/provision_keycloak_org.sh:ro
    environment:
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      ORG_NAME: KronOS Dev
      ORG_ALIAS: kronos-dev
      ORG_DESCRIPTION: Default development organization
      ORG_DOMAIN: kronos.dev
      ORG_MEMBER_IDS: "10000000-0000-4000-8000-000000000001 10000000-0000-4000-8000-000000000002 10000000-0000-4000-8000-000000000003"
    entrypoint: ["sh", "/provision_keycloak_org.sh"]

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav_dev_data:/var/lib/clamav
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  tusd:
    image: tusproject/tusd:latest
    command: >
      -port 1080
      -s3-bucket kronos-tus-uploads
      -s3-endpoint http://minio:9000
      -s3-object-prefix uploads/
      -s3-disable-ssl
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kronos_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      AWS_REGION: us-east-1
    ports: ["1080:1080"]
    depends_on:
      minio: { condition: service_healthy }

  tsa:
    # freetsa/freetsa has no public Docker image; use a lightweight stub for dev
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                self.send_response(200)
                self.send_header('Content-Type','application/timestamp-reply')
                self.end_headers()
            def log_message(self, *a): pass
        HTTPServer(('0.0.0.0', 318), H).serve_forever()
    ports: ["318:318"]

  step-ca:
    image: smallstep/step-ca:latest
    volumes:
      - step_ca_data:/home/step
    environment:
      DOCKER_STEPCA_INIT_NAME: "KronOS Internal CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_PASSWORD:-step_ca_dev_password}
    ports: ["9443:9443"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:9443/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5

  kronos-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # kronos-backend, celery-worker and celery-beat all build this exact
    # same context+dockerfile with no service-specific build args, so a
    # shared `image:` tag makes Compose build it once and reuse the result
    # for all three containers instead of running the (identical) apt/pip
    # install three times per `docker compose build`.
    image: kronos-backend:dev
    volumes:
      - ../src:/app/src:ro
      # Shared with fluent-bit (docker/fluent-bit/docker-compose.fluent-bit.yml)
      # so the JSON logs configure_logging() writes actually reach the
      # SIEM pipeline (COMP-8) instead of only going to stdout, which
      # nothing was tailing.
      - kronos_app_logs:/var/log/kronos
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD:-kronos_dev_password}@postgres:5432/kronos
      # fluent-bit.conf tails this exact path (kronos.backend input).
      KRONOS_LOG_FILE: /var/log/kronos/app.log
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # MINIO_ENDPOINT is used for the backend's own connection to MinIO
      # (resolves via Docker's internal DNS). MINIO_PUBLIC_ENDPOINT is used
      # only to sign presigned upload URLs, since the browser running on the
      # host machine cannot resolve the "minio" hostname — without this,
      # presigned URLs point at http://minio:9000/... and fail with
      # DNS_PROBE_FINISHED_NXDOMAIN in the browser.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kronos_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      MINIO_USE_TLS: "false"
      # Must match minio's MINIO_API_CORS_ALLOW_ORIGIN above — same origins,
      # enforced independently by each server (backend API vs. presigned
      # MinIO uploads).
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:4173"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_SECURITY_ENABLED: "false"
      # Browser-facing (like KEYCLOAK_PUBLIC_URL below): the backend embeds
      # this directly as the Timeline tab's iframe src, so it must be a host
      # the browser — not just other containers — can resolve. Must match
      # the nginx service's OPENSEARCH_DASHBOARDS_URL (CSP frame-src) below,
      # and opensearch-dashboards' published port.
      OPENSEARCH_DASHBOARDS_URL: http://localhost:5601
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-kronos-backend-secret}
      # The SPA's public client (frontend/.env.example VITE_KEYCLOAK_CLIENT_ID)
      # — /auth/refresh must redeem its refresh tokens as this client, not as
      # KEYCLOAK_CLIENT_ID above (a different, confidential client).
      KEYCLOAK_SPA_CLIENT_ID: kronos-frontend
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TSA_URL: http://tsa:318/api/v1/timestamp
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    command: uvicorn src.external.fastapi_app:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kronos-backend:dev
    volumes:
      - ../src:/app/src:ro
      # Same shared log volume as kronos-backend — fluent-bit.conf tails
      # /var/log/kronos/celery.log as the "kronos.celery" input (COMP-8).
      # NOTE: KRONOS_LOG_FILE below is only consumed once
      # src/external/celery_app.py calls configure_logging() at worker init,
      # matching the one-line call already wired into fastapi_app.py — that
      # part is tracked separately (celery_app.py is owned by a different
      # workstream in this multi-agent effort); this volume/env var is the
      # infra half of COMP-8 so the pipeline is ready the moment it lands.
      - kronos_app_logs:/var/log/kronos
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD:-kronos_dev_password}@postgres:5432/kronos
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kronos_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      MINIO_USE_TLS: "false"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_SECURITY_ENABLED: "false"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-kronos-backend-secret}
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TSA_URL: http://tsa:318/api/v1/timestamp
      KRONOS_LOG_FILE: /var/log/kronos/celery.log
    # Gate on health: worker_init wiring (startup.py) connects to Postgres, so it
    # must not start while "the database system is starting up", otherwise
    # configure_dependencies() fails and beat tasks hit an unconfigured repo.
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: celery -A src.external.celery_app worker -Q q.parse.fast,q.index -c 4 --loglevel=info

  celery-worker-plaso:
    build:
      context: ..
      dockerfile: docker/Dockerfile.plaso-worker
    volumes:
      - ../src:/app/src:ro
      - kronos_app_logs:/var/log/kronos
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD:-kronos_dev_password}@postgres:5432/kronos
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kronos_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      MINIO_USE_TLS: "false"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_SECURITY_ENABLED: "false"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-kronos-backend-secret}
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TSA_URL: http://tsa:318/api/v1/timestamp
      KRONOS_LOG_FILE: /var/log/kronos/celery-plaso.log
      PLASO_WORKER_PATH: /app/plaso-worker/kronos-plaso-worker.py
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: celery -A src.external.celery_app worker -Q q.parse.plaso -c 1 --loglevel=info

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kronos-backend:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD:-kronos_dev_password}@postgres:5432/kronos
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kronos_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kronos_minio_dev_password}
      MINIO_USE_TLS: "false"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: admin
      OPENSEARCH_SECURITY_ENABLED: "false"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-kronos-backend-secret}
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TSA_URL: http://tsa:318/api/v1/timestamp
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    command: celery -A src.external.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    # Browser-facing origin for each service's CSP allowance — rendered into
    # the CSP header by nginx's envsubst templating (see
    # docker/nginx/nginx.conf.template). These are Docker-host-published
    # ports, reachable from the browser on the host machine; contrast with
    # the Docker-internal hostnames (e.g. opensearch-dashboards:5601) used
    # elsewhere in this file for container-to-container traffic.
    environment:
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      BACKEND_PUBLIC_URL: http://localhost:8000
      MINIO_PUBLIC_URL: http://localhost:9000
      OPENSEARCH_DASHBOARDS_URL: http://localhost:5601
    ports: ["80:80"]
    depends_on:
      - kronos-backend

volumes:
  postgres_dev_data:
  minio_dev_data:
  opensearch_dev_data:
  clamav_dev_data:
  step_ca_data:
  # Shared with docker/fluent-bit/docker-compose.fluent-bit.yml (mounted
  # read-only there as `kronos_app_logs: external: true`) — declared here as
  # the canonical, non-external definition, matching the same pattern
  # docker/falco/docker-compose.falco.yml already uses for falco_logs
  # (COMP-8).
  kronos_app_logs:
