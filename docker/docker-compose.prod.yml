version: "3.9"
# Production configuration — requires external secrets management
# Set KRONOS_DB_PASSWORD, KRONOS_MINIO_SECRET, etc. via environment or Docker secrets

services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    # WARNING: -dev mode is in-memory, auto-unsealed and root-token only.
    # It is NOT suitable for production: the transit 'kronos-evidence' master key
    # is lost on restart, making previously-encrypted evidence undecryptable.
    # Production MUST run a sealed Vault server with persistent storage backend.
    # See docs/access-management-review.md [M-2].
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-changeme}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports: ["8200:8200"]
    healthcheck:
      # Gap Audit Milestone CCC: `vault status` with no VAULT_ADDR defaults
      # to https://127.0.0.1:8200, but dev mode (VAULT_DEV_LISTEN_ADDRESS
      # above) always serves plain HTTP -- confirmed by actually running
      # this healthcheck: it failed every single time with "server gave
      # HTTP response to HTTPS client", so this container could never
      # report healthy, which permanently blocked every downstream
      # `depends_on: vault: condition: service_healthy` (vault-init and
      # kes below) from ever starting. Real, already-correct fix already
      # exists in docker/vault/docker-compose.vault.yml's own healthcheck
      # -- copied verbatim rather than re-derived.
      test: ["CMD-SHELL", "VAULT_ADDR=http://localhost:8200 vault status 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gap Audit Milestone CCC: this file had no vault-init step at all -- the
  # transit engine was never enabled, the kronos-evidence key never created,
  # and the kv engine/policy/AppRole role KES's own keystore backend needs
  # never existed, so `kes` below would 403 on every real key operation even
  # once its own config/image bugs (also fixed this pass) were corrected.
  # Verbatim copy of the real, already-verified script from
  # docker/vault/docker-compose.vault.yml (itself proven end-to-end against
  # the pinned KES tag in poc/vault_kes_minio/ -- see that PoC's README gaps
  # #1/#2 for why the kv engine + policy grant below are both required, not
  # just transit/*), adjusted only for this file's own VAULT_DEV_TOKEN name.
  vault-init:
    image: hashicorp/vault:1.17
    restart: "no"
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:-changeme}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        vault secrets enable transit 2>/dev/null || echo "transit already enabled"
        vault write -f transit/keys/kronos-evidence type=aes256-gcm96 2>/dev/null || echo "key already exists"
        vault secrets enable -path=kv -version=1 kv 2>/dev/null || echo "kv already enabled"
        vault policy write kronos-kes - <<'POLICY'
        path "transit/keys/kronos-evidence" { capabilities = ["read"] }
        path "transit/encrypt/kronos-evidence" { capabilities = ["update"] }
        path "transit/decrypt/kronos-evidence" { capabilities = ["update"] }
        path "transit/generate-data-key/kronos-evidence" { capabilities = ["update"] }
        path "transit/datakey/plaintext/kronos-evidence" { capabilities = ["update"] }
        path "kv/kes-keys/*" { capabilities = ["create", "read", "update", "delete", "list"] }
        POLICY
        vault auth enable approle 2>/dev/null || echo "approle already enabled"
        vault write auth/approle/role/kronos-kes \
          policies=kronos-kes \
          token_ttl=1h \
          token_max_ttl=4h 2>/dev/null || echo "role already exists"
        echo "Vault initialized successfully."

  kes:
    # Gap Audit Milestone CCC: was `minio/kes:latest` (a floating tag) with
    # a bind mount at `./kes/config.yaml` -- that host path has never
    # existed (the real file is `./kes/kes-config.yml`, a different name
    # entirely), so Docker silently created an empty directory at the mount
    # point instead of failing, and `kes server --config /etc/kes/config.yaml`
    # would fail to parse it as YAML. `./certs` also does not exist anywhere
    # in this repo. Corrected to the same real, pinned image + config file +
    # named-volume-for-certs pattern already proven working end-to-end in
    # docker/kes/docker-compose.kes.yml + poc/vault_kes_minio/.
    #
    # NOT fully production-ready even after this fix -- two gaps remain,
    # neither solved anywhere in this repo yet (poc/vault_kes_minio/README.md
    # gap #3 documents the first as a known, open item):
    #   1. VAULT_APPROLE_ID/VAULT_APPROLE_SECRET below default to empty --
    #      nothing in this file fetches the real role-id/secret-id
    #      vault-init's role creates and injects them. Needs either a manual
    #      step or a new init-container automation.
    #   2. kes_certs (the named volume below) starts empty -- nothing in
    #      this file provisions the server.crt/server.key/ca.crt kes-config.yml
    #      requires, or the MinIO client cert kes-config.yml's policy
    #      identity needs to match. poc/vault_kes_minio/ generated a
    #      throwaway PKI by hand for its own run; production needs a real,
    #      deliberately-designed cert-issuance path (nothing in this repo
    #      does that today).
    image: minio/kes:2024-06-17T15-47-05Z
    depends_on:
      vault: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    environment:
      VAULT_APPROLE_ID: ${VAULT_APPROLE_ID:-}
      VAULT_APPROLE_SECRET: ${VAULT_APPROLE_SECRET:-}
      MINIO_TLS_IDENTITY: ${MINIO_TLS_IDENTITY:-_}
    volumes:
      - ./kes/kes-config.yml:/etc/kes/kes-config.yml:ro
      - kes_certs:/etc/kes/certs
    command: server --config /etc/kes/kes-config.yml

  # Streaming replication (Gap Audit V10/X2a --
  # docs/POSTGRES_MINIO_HA_RESEARCH.md §1.5 verdict: "adopt the replication
  # half now, defer automatic failover"). Real topology verified end-to-end
  # in poc/postgres_replication/ (real primary + real replica, real data
  # replicated, real pg_stat_replication sync_state=sync captured) before
  # this file was touched, per CLAUDE.md §F. No application code change --
  # the backend/Keycloak still connect to this `postgres` service (the
  # primary) only; `postgres-replica` is a passive standby.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kronos
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # wal_level/max_wal_senders/max_replication_slots are context=postmaster
    # (restart-required) GUCs, so they're baked in at cold boot.
    # synchronous_standby_names is deliberately NOT set here -- real,
    # reproduced finding (poc/postgres_replication/README.md "real finding
    # #2"): setting it from cold boot deadlocks this image's own
    # /docker-entrypoint-initdb.d database-creation bootstrap, since that's
    # a normal client transaction that would need a synchronous ack from a
    # standby that cannot exist yet. `postgres-replication-init` below
    # flips this on (reload-safe, no restart) once the replica is healthy.
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
    secrets: [db_password, replication_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check so dependents don't start during the
      # first-time initdb bootstrap (socket-only) before :5432 is listening.
      # start_period covers first-init, during which the TCP check legitimately
      # fails — otherwise retries are exhausted before the server is ready.
      test: ["CMD-SHELL", "pg_isready -U kronos -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s

  # Real Postgres 16 streaming replica (postgres:16-alpine, same pinned tag
  # as the primary), bootstrapped via `pg_basebackup -R` per
  # docker/postgres/replica-entrypoint.sh -- verified end-to-end against
  # this exact image in poc/postgres_replication/. Passive: the app never
  # connects here directly (see CLAUDE.md §F / this item's own report for
  # why no read-query routing was added).
  postgres-replica:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPL_USER: replicator
      REPLICA_APPLICATION_NAME: kronos_prod_replica
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    secrets: [replication_password]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # One-shot job (restart:"no", same pattern as `keycloak-init` below) that
  # flips the primary into synchronous replication mode once the replica is
  # confirmed healthy. See docker/postgres/replication-init.sh for the full
  # real-finding writeup of why this can't be a `command:` flag on
  # `postgres` at cold boot.
  postgres-replication-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-replica: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/replication-init.sh"]
    secrets: [db_password]
    volumes:
      - ./postgres/replication-init.sh:/replication-init.sh:ro

  # Redis DB-role separation (Milestone X2b, executing docs/
  # REDIS_BLAST_RADIUS_RESEARCH.md W5 §6.1's already-decided "adopt now"
  # verdict). The single four-role `redis:` instance below is replaced by
  # two independent single-instance deployments, matching the research's
  # own suggested split and charts/kronos/values.yaml's redis-auth-streams/
  # redis-celery aliases:
  #   - redis-auth-streams: DB0 (step-up tickets, RedisTicketStore) + DB3
  #     (stream-ingest, RedisStreamIngestAdapter) -- the two customer/
  #     telemetry-facing roles.
  #   - redis-celery: DB1 (Celery broker) + DB2 (Celery result backend) --
  #     the internal task-plumbing roles.
  # Zero src/ changes: src/config.py already models redis_url/
  # celery_broker_url/celery_result_backend/stream_redis_db as independent
  # DSNs (W5 §3.1) -- only the hostnames below and each consumer's
  # REDIS_URL/CELERY_BROKER_URL/CELERY_RESULT_BACKEND env vars change. This
  # also resolves W5's R4 finding: a large DB3 stream backlog no longer
  # shares one instance's memory ceiling with DB0/DB1's write-availability-
  # sensitive workloads.
  #
  # Two SEPARATE passwords (REDIS_AUTH_STREAMS_PASSWORD/REDIS_CELERY_PASSWORD),
  # not one REDIS_PASSWORD reused across both -- the whole point of this
  # split is blast-radius/credential isolation between the customer-facing
  # and internal-plumbing role groups; reusing one password would silently
  # reintroduce the shared-fate dependency this milestone removes.
  #
  # Real healthcheck added (was entirely absent on the single `redis:`
  # service this replaces) -- discovered while doing this work that
  # kronos-backend's own `depends_on: redis: { condition: service_healthy }`
  # below was ALREADY a hard, pre-existing failure with zero healthcheck
  # defined (verified live: `docker compose up` fails immediately with
  # "dependency failed to start: container ... has no healthcheck
  # configured", not a cosmetic gap) -- fixed here as a direct, unavoidable
  # byproduct of writing these two service blocks correctly, not a
  # speculative unrelated change.
  redis-auth-streams:
    image: redis:7-alpine
    # Gap Audit Milestone LL: password is read from the real secret file at
    # container start, never interpolated into `command:`/Config.Cmd (that
    # was this service's own real, reproduced finding --
    # poc/redis_prod_secret_cli_exposure/ -- `docker inspect --format
    # '{{json .Config.Cmd}}'` used to return the plaintext password even
    # though `docker top`/`ps aux` inside the container did not). Mirrors
    # `docker/postgres/replica-entrypoint.sh`'s own established pattern for
    # REPL_PASSWORD, adapted for redis:7-alpine (which, unlike the official
    # postgres image, has no native "_FILE" env-var convention).
    entrypoint: ["/bin/sh", "/redis-secret-entrypoint.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_auth_streams_password
    secrets: [redis_auth_streams_password]
    volumes:
      - redis_auth_streams_data:/data
      - ./redis/redis-secret-entrypoint.sh:/redis-secret-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_auth_streams_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-celery:
    image: redis:7-alpine
    # Gap Audit Milestone LL -- same fix/reasoning as redis-auth-streams above.
    entrypoint: ["/bin/sh", "/redis-secret-entrypoint.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_celery_password
    secrets: [redis_celery_password]
    volumes:
      - redis_celery_data:/data
      - ./redis/redis-secret-entrypoint.sh:/redis-secret-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_celery_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kronos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_KEY:-}
      # Browsers PUT evidence directly to MinIO via presigned URLs; this is
      # cross-origin CORS, enforced server-side (MinIO's bucket-level
      # PutBucketCors API isn't implemented — this env var is the actual
      # supported mechanism). Must match kronos-backend's CORS_ALLOWED_
      # ORIGINS below. MinIO isn't published externally in this compose
      # file yet (see MINIO_PUBLIC_ENDPOINT), so this is a no-op until it is.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://${KEYCLOAK_HOSTNAME}}
    volumes:
      - minio_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    # Gap Audit Milestone DDD: the previous approach here -- bind-mounting
    # docker/opensearch/opensearch.yml (containing only
    # plugins.security.unsupported.restapi.allow_securityconfig_modification)
    # over the container's own config/opensearch.yml, dropping only the
    # earlier `:ro` flag -- was verified LIVE to still crash-loop with the
    # exact same "failed to load plugin class [OpenSearchSecurityPlugin] ...
    # transport.keystore_filepath or ... pemcert_filepath must be set"
    # error the `:ro` removal was believed to have fixed. Real root cause,
    # confirmed by reading the container's own boot log line by line:
    # OpenSearch's bundled install_demo_configuration.sh checks whether
    # opensearch.yml already contains ANY `plugins.security.*` key --
    # including this file's single REST-API flag, unrelated to SSL -- and
    # if so prints "seems to be already configured for Security. Quit."
    # and skips populating the transport-SSL cert paths + copying the demo
    # certs entirely, so the security plugin ends up enabled with SSL
    # requested but zero cert paths configured. `docker-compose.dev.yml`'s
    # own opensearch service (proven working end-to-end, poc/
    # opensearch_dashboards_sso/) never hit this because it does NOT mount
    # any file over opensearch.yml at all -- it passes the identical flag
    # as a plain environment override instead (OpenSearch's real
    # entrypoint, opensearch-docker-entrypoint.sh, translates any
    # `key.subkey=value` env into `-Ekey.subkey=value`, independent of the
    # file), leaving the container's own internal opensearch.yml genuinely
    # empty of any plugins.security.* key so the demo installer runs
    # unimpeded. Mirrored that exact, already-proven pattern here --
    # confirmed live afterward: security plugin loads, cluster goes
    # healthy. docker/opensearch/opensearch.yml is no longer referenced by
    # this file (dev never referenced it either); left in place only in
    # case a future real (non-demo) TLS material path wants a real config
    # file again.
    #
    # Second real bug found in the same boot log: OpenSearch >=2.12 (this
    # pins 2.13.0; dev deliberately pins 2.11.1 and never hit this)
    # requires OPENSEARCH_INITIAL_ADMIN_PASSWORD or the demo installer
    # refuses to set any admin credential and quits. Reused the same real
    # OPENSEARCH_ADMIN_PASSWORD this file's own opensearch-security-init
    # service already requires below, rather than inventing a second
    # admin-password variable.
    environment:
      - cluster.name=kronos-prod
      - node.name=kronos-node-1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - plugins.security.unsupported.restapi.allow_securityconfig_modification=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required to bootstrap OpenSearch security}
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    # Previously absent -- nothing in this file waited for OpenSearch to be
    # genuinely healthy before opensearch-security-init ran (plain list-form
    # `depends_on: [opensearch]` only orders container *start*). Mirrors
    # docker-compose.dev.yml's own proven healthcheck, adapted for the real
    # (non-demo-default) admin password this file requires.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_ADMIN_PASSWORD:-} -f https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak:
    # 26.2 (not 26.0): the organization-id token claim (addOrganizationId) the
    # backend's _extract_tenant requires only lands in 26.1+. Keep in sync with dev.
    image: quay.io/keycloak/keycloak:26.2
    # Gap Audit Milestone DDD: this file had NO mechanism to provision the
    # `kronos` realm at all -- confirmed live, keycloak-init below (whose
    # own comment already assumed "the realm is already provisioned")
    # failed for real with "realm 'kronos' does not exist" once the two
    # more severe boot-time bugs above were fixed enough to reach it.
    # docs/deployment.md's own Path-A-adjacent instructions already say
    # "Ensure docker/keycloak/kronos-realm.json is mounted and Keycloak has
    # --import-realm flag" -- that instruction was never actually wired
    # into this file. `--import-realm` is a genuine Keycloak Quarkus CLI
    # option, not a `start-dev`-only flag (confirmed live: works
    # identically under production `start`, real Postgres backend, real
    # HTTPS+bootstrap-admin config all still active). Config mirrors
    # docker-compose.dev.yml's own already-proven `start-dev --import-realm`
    # pattern, minus the dev-only `start-dev`.
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kronos
      KC_DB_USERNAME: kronos
      KC_DB_PASSWORD: ${KRONOS_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak.kronos.example}
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
      # Gap Audit Milestone DDD: this file never configured a bootstrap
      # admin account at all (unlike docker-compose.dev.yml's own
      # KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD) -- confirmed live, real
      # Keycloak logs a genuine LOGIN_ERROR/user_not_found for "admin" on
      # every attempt, meaning keycloak-init below (and any real human
      # operator) could never authenticate to a fresh deployment at all.
      # Reuses the exact same KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD vars
      # keycloak-init already consumes as KC_ADMIN_USER/KC_ADMIN_PASSWORD
      # below, so the two are guaranteed to match rather than drifting.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Gap Audit Milestone DDD: confirmed live (Keycloak's own startup log:
      # "Listening on: https://0.0.0.0:8443" -- nothing else) that
      # Quarkus's production `start` command, once HTTPS certs are
      # configured, disables the plain HTTP listener entirely unless this
      # is explicitly set. That silently broke every internal caller this
      # file itself wires to `http://keycloak:8080`: keycloak-init hangs in
      # its own retry loop until a hard ~5-minute timeout (confirmed live:
      # never once reached "waiting" -> success), and -- far more severe --
      # kronos-backend/celery-worker's own KEYCLOAK_URL below, which real
      # JWT verification (JWKS fetch) depends on for every request, points
      # at the identical unreachable http://keycloak:8080. Real production
      # JWT auth would have been completely broken, not just the
      # provisioning script. Internal container-network traffic (this
      # entire compose network is never exposed to a browser directly --
      # only nginx's real, externally-trusted TLS on 80/443 is) has no need
      # for the internal hop to also be TLS; KC_HOSTNAME/HTTPS above remain
      # the correct config for whatever DOES terminate real external HTTPS
      # to Keycloak directly, if anything ever does.
      KC_HTTP_ENABLED: "true"
      # Gap Audit Milestone DDD: "fgap-v2" is not a real Keycloak 26.2
      # feature flag -- confirmed live, this made Keycloak exit(2) at boot
      # ("fgap-v2 is an unrecognized feature") before it could serve a
      # single request, the most severe kind of finding since nothing
      # downstream (keycloak-init, opensearch-security-init's openid authc
      # domain, the backend's own JWT verification) can work at all while
      # Keycloak itself won't start. Traced the origin: reviews/
      # Part_6_Review.md describes "FGAP v2" (Organizations as an
      # admin-permission resource type) as a Keycloak 26.7.0 (May 2026)
      # feature -- this repo pins 26.2 (see this service's own comment
      # above on why: the org-id token claim needs 26.1+, but not as new
      # as 26.7), and grep confirms zero src/ code depends on FGAP v2
      # today. Removed rather than swapped to a real flag name -- there is
      # no FGAP-v2-equivalent flag in 26.2, the feature doesn't exist yet
      # at this pinned version. Revisit alongside a real Keycloak 26.7+
      # upgrade if/when reviews/Part_6_Review.md's org-scoped
      # fine-grained-authz design is actually implemented.
      KC_FEATURES: organization,token-exchange
    volumes:
      - ./certs:/certs:ro
      - ./keycloak/kronos-realm.json:/opt/keycloak/data/import/kronos-realm.json:ro

  # Ensures the KronOS organization exists via the Admin REST API (the same
  # approach as dev) — never via a realm-import organizations block, which
  # Keycloak 26.2 rejects with "Can not update organization group".
  # Assumes the realm is already provisioned. ORG_MEMBER_IDS is empty in prod:
  # real users join the org through the IdP / org domain, not by seeded ids.
  # Built (not bind-mounted) -- see docker/init/Dockerfile.keycloak-init for
  # why: curlimages/curl runs as non-root, and Docker Desktop/WSL2's
  # bind-mount layer doesn't reliably grant non-root container users read
  # access to host files, even when the real host file mode is 0755.
  keycloak-init:
    build:
      context: ..
      dockerfile: docker/init/Dockerfile.keycloak-init
    restart: "no"
    depends_on:
      - keycloak
    environment:
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
      KC_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ORG_NAME: ${KRONOS_ORG_NAME:-KronOS}
      ORG_ALIAS: ${KRONOS_ORG_ALIAS:-kronos}
      ORG_DESCRIPTION: KronOS production organization
      # Gap Audit Milestone DDD: was `${KRONOS_ORG_DOMAIN:-}` (silently
      # empty) -- confirmed live against the real Keycloak 26.2 Organizations
      # API that an empty `domains: []` array is rejected outright:
      # `{"errorMessage":"You must provide at least one domain"}`, HTTP 400,
      # every time. scripts/provision_keycloak_org.sh's own comment already
      # explains *why* prod needs a real domain ("real users join the org
      # through the IdP / org domain, not by seeded ids") but the var
      # supplying that domain had no required-value guard, so an operator
      # who didn't already know this Keycloak API constraint would get a
      # silent, unexplained "organization kronos could not be created or
      # found" failure with no indication a domain was the missing
      # ingredient. Required now, matching this file's own
      # OPENSEARCH_ADMIN_PASSWORD precedent above for a var with no safe
      # default.
      ORG_DOMAIN: ${KRONOS_ORG_DOMAIN:?KRONOS_ORG_DOMAIN is required -- Keycloak's real Organizations API rejects an org with zero domains}

  # Adds the openid authc domain (trusting Keycloak) and the generic DLS
  # tenant role to OpenSearch's security config -- the exact same one-time
  # cluster bootstrap docker-compose.dev.yml's opensearch-init runs, using
  # the identical shared script (scripts/provision_opensearch_security.py,
  # its own docstring already names this as "the single source of truth
  # shared by dev/prod compose and any future Helm provisioning Job").
  # Previously this compose file had NO equivalent of dev's opensearch-init
  # at all (roadmap I3 "SA/AD/ISM provisioning" gap) -- note the per-org
  # Security Analytics/Anomaly-Detection detectors and the ISM
  # rollover/index-template themselves do NOT need this step: those are
  # already auto-provisioned by the running backend/celery-worker (see
  # ensure_index_template/ensure_ism_policy in TimelineIngestionService,
  # ensure_org_detectors in the case-creation route, ensure_org_detector in
  # anomaly_scoring.py) using the same OPENSEARCH_URL/USERNAME/PASSWORD
  # already wired below -- that part already worked in this file before
  # this change. What was genuinely missing is this openid+DLS bootstrap,
  # which only the app's *tenant-scoped* Dashboards/DLS path depends on.
  opensearch-security-init:
    image: python:3.12-alpine
    restart: "no"
    # Gap Audit Milestone DDD: was list-form `- opensearch` (start-order
    # only) -- now that `opensearch` has a real healthcheck (added this
    # same pass), wait for genuine health, matching every other real
    # `condition: service_healthy` dependency in this file. Without this,
    # this script's own connection retries were the only thing standing
    # between it and racing a still-booting security plugin.
    depends_on:
      opensearch: { condition: service_healthy }
    volumes:
      - ../scripts/provision_opensearch_security.py:/provision_opensearch_security.py:ro
    environment:
      # Fixed 2026-08-10 (Gap Audit P0-1) -- same real scheme mismatch as
      # kronos-backend's own OPENSEARCH_URL above: OpenSearch here is
      # HTTPS-only (security plugin enabled, no ssl.http.enabled override).
      # provision_opensearch_security.py already builds its own
      # ssl.CERT_NONE context for the self-signed demo cert, so no other
      # change is needed alongside this scheme fix.
      OS_BASE: https://opensearch:9200
      OS_ADMIN_USER: ${OPENSEARCH_ADMIN_USER:-admin}
      OS_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required to bootstrap OpenSearch security}
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
    entrypoint: ["python3", "/provision_opensearch_security.py"]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes:
      - clamav_db:/var/lib/clamav
    # Reconciles clamd's own real stream/file/scan size ceiling with
    # KronOS's upload ceiling (src/config.py Settings.max_upload_bytes) --
    # identical mechanism to docker-compose.dev.yml (see
    # poc/clamav/README_large_file_fix.md for the full root-cause account:
    # without this, clamd's compiled-in 100 MB default silently closes the
    # INSTREAM connection -- BrokenPipeError -- on any real forensic image
    # above that size, even though KronOS itself accepts up to 5 GiB). The
    # clamav/clamav:stable image's own /init entrypoint reads any
    # CLAMD_CONF_<Setting> env var and rewrites the matching clamd.conf
    # directive -- verified against the real pinned image, not guessed.
    # Must stay >= MAX_UPLOAD_BYTES below (kronos-backend/celery-worker),
    # hence the single shared KRONOS_MAX_UPLOAD_BYTES var driving both.
    environment:
      CLAMD_CONF_StreamMaxLength: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      CLAMD_CONF_MaxFileSize: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      CLAMD_CONF_MaxScanSize: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  tsa:
    image: freetsa/freetsa:latest
    ports: ["318:318"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    # Browser-facing origin for each service's CSP allowance, rendered into
    # the CSP header by nginx's envsubst templating (see
    # docker/nginx/nginx.conf.template and the matching note on
    # kronos-backend's OPENSEARCH_DASHBOARDS_URL above). Set these to real
    # public hostnames for this deployment — BACKEND_PUBLIC_URL/
    # MINIO_PUBLIC_URL default empty (omitted from the CSP) since this
    # compose file doesn't publish those ports directly to the browser.
    environment:
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      OPENSEARCH_DASHBOARDS_URL: ${OPENSEARCH_DASHBOARDS_URL:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - kronos-backend

  # Real schema migrations (Gap Audit P1-12 / Milestone V4): a one-shot
  # `alembic upgrade head` run using the exact same built/pushed backend
  # image as kronos-backend/celery-worker below (command override only, no
  # separate image) -- mirrors this file's own keycloak-init/opensearch-
  # security-init one-shot-container pattern. This is now the ONLY schema-
  # mutating step in this deployment: kronos-backend/celery-worker no
  # longer call create_tables() at their own boot (see src/external/
  # startup.py and docs/DATABASE_MIGRATIONS.md). A production deploy MUST
  # run this (or an equivalent `docker compose run db-migrate` /
  # `alembic upgrade head` step in whatever orchestrator replaces Compose
  # for this environment) before rolling kronos-backend/celery-worker to a
  # new image that expects a new column/table.
  db-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    # Gap Audit Milestone MM: this service (and kronos-backend/celery-worker
    # below) used to interpolate ${POSTGRES_PASSWORD}/${REDIS_*_PASSWORD}
    # directly into a DATABASE_URL/REDIS_URL/CELERY_* value in this
    # `environment:` block -- `docker inspect --format
    # '{{json .Config.Env}}'` returned the fully-resolved plaintext DSN
    # verbatim (see poc/backend_prod_secret_config_env_exposure/ for the
    # real, captured repro+fix -- the same class of finding Milestone LL
    # already fixed for redis-auth-streams/redis-celery's own `command:`
    # argv, this time in `Config.Env` instead of `Config.Cmd`). This image
    # has no shell (cgr.dev/chainguard/python:latest, see docker/Dockerfile's
    # own ENTRYPOINT [] comment), so Milestone LL's sh-entrypoint-script
    # pattern doesn't apply here.
    #
    # This service specifically does NOT go through src/config.py's
    # Settings class at all (`command: alembic upgrade head` -- confirmed
    # by reading migrations/env.py's own docstring: it deliberately reads
    # DATABASE_URL directly, bypassing Settings()'s ~15 unrelated required
    # fields a migration-only run has no reason to need), so kronos-backend/
    # celery-worker's `secrets_dir`/KRONOS_SECRETS_DIR fix below does not
    # apply here. Fixed instead in migrations/db_url.py: DATABASE_URL_FILE
    # (mirrors the official postgres image's own POSTGRES_PASSWORD_FILE
    # convention, already used elsewhere in this same file) points at the
    # same `database_url` Docker secret kronos-backend/celery-worker use.
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - source: database_url
        target: database_url
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: alembic upgrade head

  kronos-backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    # NOTE: Every var below maps to a required field in src/config.py (Settings).
    # Settings() has no defaults for these — a missing/renamed var crashes boot.
    # SECURITY TODO (see docs/access-management-review.md):
    #   - MINIO_ACCESS_KEY/SECRET_KEY must be a *scoped service account*, not root.
    #   - tusd must use a separate put-only service account, not the backend's.
    environment:
      # Gap Audit Milestone MM: DATABASE_URL/REDIS_URL/CELERY_BROKER_URL/
      # CELERY_RESULT_BACKEND below are no longer plaintext-interpolated
      # here -- see db-migrate's own comment above for the full finding +
      # fix. KRONOS_SECRETS_DIR is a path convention, not a secret.
      KRONOS_SECRETS_DIR: ${KRONOS_SECRETS_DIR:-/run/secrets}
      # Real, separate gap found while reconciling clamav's own
      # CLAMD_CONF_StreamMaxLength/MaxFileSize/MaxScanSize below with this
      # value (see clamav service comment + poc/clamav/README_large_file_fix.md):
      # this var was never set here at all, so the backend silently fell
      # back to src/config.py's compiled-in 5 GiB Python default. That
      # happens to equal clamd's own default ceiling today, but the two
      # would silently drift apart the moment anyone overrides
      # KRONOS_MAX_UPLOAD_BYTES (e.g. to raise the ceiling) without
      # touching this file — clamd would honor the new ceiling and accept
      # the larger stream, but the backend would still reject/mis-track it
      # at the old default. Mirrors docker-compose.dev.yml's identical var
      # on both kronos-backend and celery-worker (dev's own comment there
      # documents the same real 239 MB E01 upload root-cause trace).
      MAX_UPLOAD_BYTES: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      # MINIO_ENDPOINT is host:port only — startup.py prepends the scheme from MINIO_USE_TLS.
      MINIO_ENDPOINT: minio:9000
      # MinIO is not published outside the compose network here, so evidence
      # upload/finalize is not usable from a real browser until this is set
      # to a host the browser can reach (e.g. an MinIO ingress/LB hostname) —
      # presigned URLs are signed against this host (SigV4 signs Host), so it
      # cannot just be swapped after the fact. See MINIO_PUBLIC_ENDPOINT in
      # src/config.py / src/adapter/storage/s3.py.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio:9000}
      MINIO_USE_TLS: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      # Gap Audit Milestone NN: MINIO_SECRET_KEY/OPENSEARCH_PASSWORD/
      # KEYCLOAK_CLIENT_SECRET/VAULT_TOKEN below were the same class of
      # docker inspect Config.Env plaintext exposure Milestone MM fixed for
      # DATABASE_URL/REDIS_URL/CELERY_BROKER_URL/CELERY_RESULT_BACKEND --
      # missed in that pass because the grep that found them was scoped to
      # ${...PASSWORD}/DSN-shaped values, not every SecretStr field in
      # Settings. Fixed the same way: resolved via KRONOS_SECRETS_DIR
      # (already set above) from the `secrets:` block below -- no new
      # src/config.py code needed, secrets_dir already applies to every
      # Settings field, verified directly against a real Settings()
      # instantiation for these exact four fields before this file was
      # touched. Deliberately drops the MINIO_ROOT_PASSWORD fallback this
      # var used to have -- the secret file must contain the real,
      # intentional MinIO secret key value; see this repo's own SECURITY
      # TODO comment above this block (a scoped service account, not root,
      # is the real fix for that fallback's own root-credential-reuse risk).
      # Must match minio's MINIO_API_CORS_ALLOW_ORIGIN above. Defaults to the
      # Keycloak hostname as a best-guess prod domain — override with the
      # real frontend origin(s) if they differ (comma-separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${KEYCLOAK_HOSTNAME}}
      # Fixed 2026-08-10 (Gap Audit P0-1): was http://, but the `opensearch`
      # service above has the security plugin enabled with no
      # plugins.security.ssl.http.enabled override in docker/opensearch/
      # opensearch.yml, so it serves HTTPS-only on 9200 (identical to
      # docker-compose.dev.yml's own opensearch, which already correctly
      # uses https:// throughout) -- an http:// URL here could never
      # actually reach it. App-side cert verification is already correctly
      # relaxed for OpenSearch's self-signed demo cert
      # (verify_certs=False, src/external/startup.py), so no further
      # settings change is needed alongside this scheme fix.
      OPENSEARCH_URL: https://opensearch:9200
      # Non-superuser service account (a superuser bypasses OpenSearch DLS).
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-kronos_backend}
      # OPENSEARCH_PASSWORD -- see Gap Audit Milestone NN comment above
      # MINIO_SECRET_KEY: resolved via KRONOS_SECRETS_DIR + secrets: below.
      # Real OpenSearch Security plugin is genuinely enabled on the `opensearch`
      # image/config above (unlike a DISABLE_SECURITY_PLUGIN=true dev-only
      # cluster) -- this was previously unset here (defaults False,
      # src/config.py), which silently skipped
      # TimelineIngestionService.ensure_generic_tenant_role() on every real
      # ingest. Mirrors docker-compose.dev.yml's own OPENSEARCH_SECURITY_ENABLED.
      OPENSEARCH_SECURITY_ENABLED: "true"
      # KEYCLOAK_URL = internal URL used to fetch JWKS; KEYCLOAK_PUBLIC_URL = issuer in the token.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      # KEYCLOAK_CLIENT_SECRET -- resolved via KRONOS_SECRETS_DIR + secrets:
      # below, same as OPENSEARCH_PASSWORD/MINIO_SECRET_KEY/VAULT_TOKEN.
      # Browser-facing OpenSearch Dashboards origin (e.g.
      # https://os.kronos.example) for the Timeline tab's iframe embed.
      # No OpenSearch Dashboards service is deployed by this compose file —
      # leave unset to disable the feature (503), or point it at wherever
      # Dashboards is actually reachable from the browser. Must match the
      # nginx service's OPENSEARCH_DASHBOARDS_URL (CSP frame-src) below.
      OPENSEARCH_DASHBOARDS_URL: ${OPENSEARCH_DASHBOARDS_URL:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      TSA_URL: http://tsa:318
      VAULT_URL: http://vault:8200
      # VAULT_TOKEN -- resolved via KRONOS_SECRETS_DIR + secrets: below.
      # Shared step-up ticket store — required because this service runs 2
      # replicas (audit M-4). The app bootstrap passes
      # build_step_up_ticket_store(settings) into create_app().
      STEP_UP_TICKET_STORE: redis
      # SIEM/SOAR outbound sink connectors + Defender inbound poll source
      # (roadmap Milestones R2-R4/Q4, wired 2026-08-09 Milestone S). All
      # optional -- ${VAR:-} defaults to empty/unset, which
      # configure_*_from_settings() (src/external/dependencies.py) treats
      # as an honest "not configured" state, never an error. See
      # docker/.env.example for what each one means. Names verified 1:1
      # against src/config.py's Settings field names.
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      CEF_SYSLOG_HOST: ${CEF_SYSLOG_HOST:-}
      CEF_SYSLOG_PORT: ${CEF_SYSLOG_PORT:-514}
      SENTINEL_DCE_ENDPOINT: ${SENTINEL_DCE_ENDPOINT:-}
      SENTINEL_DCR_IMMUTABLE_ID: ${SENTINEL_DCR_IMMUTABLE_ID:-}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      # Defender's poll source is only wired from the async startup path
      # (wire_dependencies_async(), which kronos-backend runs) --
      # deliberately not added to celery-worker below, see
      # wire_dependencies_sync()'s own 2026-08-09 comment in
      # src/external/startup.py for why (its OAuth2 client keeps a
      # process-lifetime httpx.AsyncClient that would not survive Celery's
      # per-task fresh-event-loop model safely).
      DEFENDER_TENANT_ID: ${DEFENDER_TENANT_ID:-}
      DEFENDER_CLIENT_ID: ${DEFENDER_CLIENT_ID:-}
      DEFENDER_CLIENT_SECRET: ${DEFENDER_CLIENT_SECRET:-}
    # Gap Audit Milestone MM: the real DSN material (was DATABASE_URL/
    # REDIS_URL/CELERY_BROKER_URL/CELERY_RESULT_BACKEND above) now arrives as
    # mounted secret files under KRONOS_SECRETS_DIR instead. `redis_url`'s
    # `source:` is deliberately named `redis_auth_streams_url` (not
    # `redis_url`) -- the DEPLOYER-FACING secret name documents which Redis
    # instance/password it actually contains (mirrors redis_auth_streams_
    # password's own naming below), while `target:` is what
    # src/config.py's secrets_dir lookup actually requires (the field name,
    # `redis_url`) -- these are allowed to differ in Compose's long secrets
    # syntax. Each secret's CONTENT must be the full, pre-assembled DSN
    # string (e.g. `redis://:<password>@redis-auth-streams:6379/0`), not
    # just the bare password -- a real, documented operational step (see
    # poc/backend_prod_secret_config_env_exposure/README.md "Operational
    # contract" for exactly how to assemble/provision each one).
    secrets:
      - source: database_url
        target: database_url
      - source: redis_auth_streams_url
        target: redis_url
      - source: celery_broker_url
        target: celery_broker_url
      - source: celery_result_backend_url
        target: celery_result_backend
      # Gap Audit Milestone NN: the four SecretStr fields below (
      # MINIO_SECRET_KEY/OPENSEARCH_PASSWORD/KEYCLOAK_CLIENT_SECRET/
      # VAULT_TOKEN) are the same class of Config.Env exposure Milestone MM
      # fixed for the DSN fields, missed there because that pass grepped
      # for DSN-shaped values, not every SecretStr field in Settings.
      # secrets_dir already applies generically to ANY Settings field (no
      # src/config.py change needed -- verified directly: a real Settings()
      # call with KRONOS_SECRETS_DIR pointed at a temp dir containing files
      # named minio_secret_key/opensearch_password/keycloak_client_secret/
      # vault_token resolved all four correctly, same mechanism Milestone MM
      # already proved against database_url/etc). Source/target match here
      # (unlike redis_auth_streams_url above) since the field names ARE
      # already deployer-legible.
      - source: minio_secret_key
        target: minio_secret_key
      - source: opensearch_password
        target: opensearch_password
      - source: keycloak_client_secret
        target: keycloak_client_secret
      - source: vault_token
        target: vault_token
    depends_on:
      postgres: { condition: service_healthy }
      # Needs BOTH: REDIS_URL/step-up ticket store lives on redis-auth-streams,
      # but this service also enqueues Celery tasks (task_queue.enqueue_dispatch())
      # via CELERY_BROKER_URL on redis-celery -- same split as celery-worker below.
      redis-auth-streams: { condition: service_healthy }
      redis-celery: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
      restart_policy:
        condition: on-failure
        max_attempts: 3

  celery-worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    # celery_app.py instantiates Settings() at import — the same required
    # fields as the backend must be present or the worker crashes on boot.
    environment:
      # Gap Audit Milestone MM: DATABASE_URL/REDIS_URL/CELERY_BROKER_URL/
      # CELERY_RESULT_BACKEND below are no longer plaintext-interpolated
      # here -- see db-migrate's own comment (top of this file) for the
      # full finding + fix. KRONOS_SECRETS_DIR is a path convention, not a
      # secret. This worker genuinely needs DB0 (redis_url, step-up ticket
      # store, confirmed via src/external/celery_app.py -> startup.py) same
      # as kronos-backend above -- both point at redis-auth-streams.
      KRONOS_SECRETS_DIR: ${KRONOS_SECRETS_DIR:-/run/secrets}
      # Real, reproduced finding (poc/evidence_intake_async/): this was
      # missing here even though kronos-backend has it -- process_intake
      # (validate/scan/hash/promote) now runs in THIS worker, not the
      # backend request thread, so an unreachable clamd here is what
      # actually matters. configure_clamav_from_settings() hard-fails
      # worker startup in production if clamd is unreachable (EVID-6) --
      # better a loud crash than silently scanning nothing.
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Same real gap as kronos-backend above (this is the service that
      # actually runs process_intake's clamd scan, so it must agree with
      # kronos-backend's value or the two silently drift the moment
      # KRONOS_MAX_UPLOAD_BYTES is overridden) -- mirrors
      # docker-compose.dev.yml's identical var on this same worker.
      MAX_UPLOAD_BYTES: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_TLS: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      # MINIO_SECRET_KEY -- Gap Audit Milestone NN: resolved via
      # KRONOS_SECRETS_DIR + secrets: below, same as kronos-backend above.
      # Fixed 2026-08-10 (Gap Audit P0-1) -- same real scheme mismatch as
      # kronos-backend's own OPENSEARCH_URL above.
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-kronos_backend}
      # OPENSEARCH_PASSWORD -- resolved via KRONOS_SECRETS_DIR + secrets: below.
      # This worker consumes q.index (dispatch_parse/finalize_evidence), which
      # is exactly the code path that calls
      # TimelineIngestionService.ensure_generic_tenant_role() -- the same
      # real gap fixed on kronos-backend above applies here too (it was
      # missing on this service specifically, even though kronos-backend
      # had it, and docker-compose.dev.yml sets it on ALL FOUR of its
      # backend/celery-worker/celery-worker-plaso services). Confirmed via
      # `grep -rn ensure_generic_tenant_role src/` that only
      # timeline_ingest.py calls it, and celery_app.py routes
      # dispatch_parse/finalize_evidence to q.index, which this worker
      # consumes (-Q q.parse.fast,q.index,q.intake below).
      OPENSEARCH_SECURITY_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      # KEYCLOAK_CLIENT_SECRET -- resolved via KRONOS_SECRETS_DIR + secrets:
      # below.
      VAULT_URL: http://vault:8200
      # VAULT_TOKEN -- resolved via KRONOS_SECRETS_DIR + secrets: below.
      # SIEM/SOAR outbound sink connectors (roadmap Milestones R2-R4, wired
      # 2026-08-09 Milestone S -- see kronos-backend's identical block
      # above for the full comment). NOT including DEFENDER_* here on
      # purpose -- wire_dependencies_sync() (src/external/startup.py)
      # deliberately does not call configure_defender_poll_source_from_settings()
      # for this worker, see that function's own 2026-08-09 comment.
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      CEF_SYSLOG_HOST: ${CEF_SYSLOG_HOST:-}
      CEF_SYSLOG_PORT: ${CEF_SYSLOG_PORT:-514}
      SENTINEL_DCE_ENDPOINT: ${SENTINEL_DCE_ENDPOINT:-}
      SENTINEL_DCR_IMMUTABLE_ID: ${SENTINEL_DCR_IMMUTABLE_ID:-}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
    # Gap Audit Milestone MM -- same four secrets/targets as kronos-backend
    # above (this worker needs the identical DSNs: DB0 on redis-auth-streams,
    # DB1/DB2 on redis-celery, same Postgres primary).
    # Gap Audit Milestone NN adds the same four additional secrets as
    # kronos-backend's own block above (MINIO_SECRET_KEY/OPENSEARCH_PASSWORD/
    # KEYCLOAK_CLIENT_SECRET/VAULT_TOKEN) -- this worker needs the identical
    # values.
    secrets:
      - source: database_url
        target: database_url
      - source: redis_auth_streams_url
        target: redis_url
      - source: celery_broker_url
        target: celery_broker_url
      - source: celery_result_backend_url
        target: celery_result_backend
      - source: minio_secret_key
        target: minio_secret_key
      - source: opensearch_password
        target: opensearch_password
      - source: keycloak_client_secret
        target: keycloak_client_secret
      - source: vault_token
        target: vault_token
    # Was a plain list-form `depends_on: [redis, postgres]` -- that form
    # only orders container *start*, it does not wait for readiness, which
    # is not good enough for db-migrate specifically: db-migrate is a
    # one-shot `restart: "no"` container that must fully EXIT successfully
    # (schema applied) before this worker's own boot (which no longer runs
    # create_tables() itself, see src/external/startup.py) can rely on the
    # schema existing. Converted to map form with explicit conditions
    # (matching kronos-backend's own depends_on above) for all three.
    # redis-auth-streams/redis-celery upgraded from the old single `redis`
    # dependency's `service_started` to `service_healthy` (Milestone X2b) --
    # now that both real services define a real healthcheck (previously
    # entirely absent, see redis-auth-streams's own service-block comment),
    # matching kronos-backend's own stronger condition for the same reason.
    depends_on:
      redis-auth-streams: { condition: service_healthy }
      redis-celery: { condition: service_healthy }
      postgres: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    command: celery -A src.external.celery_app worker -Q q.parse.fast,q.index,q.intake -c 4
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g

secrets:
  # Gap Audit Milestone DDD: every secret below used to be declared
  # `external: true`. Real, reproduced finding: plain (non-Swarm) `docker
  # compose up` -- the exact command README.md's own "Path A — Docker
  # Compose (single host)" section documents and this repo has never run
  # any other way -- rejects an `external: true` secret outright with
  # "unsupported external secret <name>" the moment the first
  # secret-consuming service (postgres) starts; confirmed live, nothing
  # in this file could ever have started past that point. `external: true`
  # is a Docker Swarm concept (a secret pre-created via `docker secret
  # create`, consumed by `docker stack deploy`) -- this repo documents and
  # has only ever exercised plain Compose (README.md's own instructions,
  # `docker-compose.dev.yml`/`.test.yml`, every CI workflow). Converted to
  # `file:`, pointing at the exact `docker/secrets/<name>.txt` path
  # README.md's own Path A instructions already tell the operator to
  # `printf` each secret into (that path never existed as a real
  # directory in this repo before this fix, and would have made the
  # README's own copy-pasted instructions fail on this same error even if
  # every earlier step had been followed correctly). If a real Swarm
  # deployment is ever wanted, restore `external: true` and provision via
  # `docker secret create` instead. `poc/postgres_replication/README.md`
  # PART 3 already independently found and worked around this identical
  # issue for its own one-off verification run, scoped to db_password/
  # replication_password only -- this fix applies the same, now-standard
  # fix to all ten secrets in this file, not just those two, and updates
  # the real shipped file rather than a throwaway PoC copy.
  db_password:
    file: ./secrets/db_password.txt
  # Streaming replication (Gap Audit V10/X2a) -- dedicated password for the
  # `replicator` role, mirrors db_password's own file-secret pattern.
  replication_password:
    file: ./secrets/replication_password.txt
  # Gap Audit Milestone LL -- closes the redis-auth-streams/redis-celery
  # `command:`-argv secret exposure found in the second multi-scenario
  # assessment (poc/redis_prod_secret_cli_exposure/). Two separate secrets,
  # matching those two services' own separate-password design (see
  # redis-auth-streams' comment above for why one shared REDIS_PASSWORD
  # was rejected).
  redis_auth_streams_password:
    file: ./secrets/redis_auth_streams_password.txt
  redis_celery_password:
    file: ./secrets/redis_celery_password.txt
  # Gap Audit Milestone MM -- closes db-migrate/kronos-backend/celery-worker's
  # Config.Env exposure (poc/backend_prod_secret_config_env_exposure/): each
  # of these four secrets' CONTENT is a full, pre-assembled connection
  # string (not just a bare password), consumed via src/config.py's new
  # secrets_dir support. See that PoC's README "Operational contract" for
  # the provisioning step -- deliberately full-DSN-per-secret (not
  # per-component host/user/password fields) so a deployer with the
  # existing db_password/redis_*_password secrets can compose these
  # directly, no src/ DSN-assembly code needed.
  database_url:
    file: ./secrets/database_url.txt
  redis_auth_streams_url:
    file: ./secrets/redis_auth_streams_url.txt
  celery_broker_url:
    file: ./secrets/celery_broker_url.txt
  celery_result_backend_url:
    file: ./secrets/celery_result_backend_url.txt
  # Gap Audit Milestone NN -- closes kronos-backend/celery-worker's
  # remaining Config.Env exposure, the same class of finding Milestone MM
  # fixed for the four DSN fields above but missed for these four (a
  # separate, ordinary Settings SecretStr field each, not DSN-shaped, so
  # MM's own DSN-focused grep didn't catch them). Unlike the DSN secrets
  # above, each of these four secrets' content is the bare, single value
  # itself (a real password/token/client-secret string) -- there is no
  # "assembly" step, the deployer just puts the existing raw credential
  # value into a file for each.
  minio_secret_key:
    file: ./secrets/minio_secret_key.txt
  opensearch_password:
    file: ./secrets/opensearch_password.txt
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret.txt
  vault_token:
    file: ./secrets/vault_token.txt

volumes:
  postgres_data:
  postgres_replica_data:
  redis_auth_streams_data:
  redis_celery_data:
  minio_data:
  opensearch_data:
  clamav_db:
  kes_certs:
