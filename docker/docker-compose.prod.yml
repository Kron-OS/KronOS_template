version: "3.9"
# Production configuration — requires external secrets management
# Set KRONOS_DB_PASSWORD, KRONOS_MINIO_SECRET, etc. via environment or Docker secrets

services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    # WARNING: -dev mode is in-memory, auto-unsealed and root-token only.
    # It is NOT suitable for production: the transit 'kronos-evidence' master key
    # is lost on restart, making previously-encrypted evidence undecryptable.
    # Production MUST run a sealed Vault server with persistent storage backend.
    # See docs/access-management-review.md [M-2].
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-changeme}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kes:
    image: minio/kes:latest
    depends_on:
      vault: { condition: service_healthy }
    volumes:
      - ./kes/config.yaml:/etc/kes/config.yaml:ro
      - ./certs:/certs:ro
    command: server --config /etc/kes/config.yaml

  # Streaming replication (Gap Audit V10/X2a --
  # docs/POSTGRES_MINIO_HA_RESEARCH.md §1.5 verdict: "adopt the replication
  # half now, defer automatic failover"). Real topology verified end-to-end
  # in poc/postgres_replication/ (real primary + real replica, real data
  # replicated, real pg_stat_replication sync_state=sync captured) before
  # this file was touched, per CLAUDE.md §F. No application code change --
  # the backend/Keycloak still connect to this `postgres` service (the
  # primary) only; `postgres-replica` is a passive standby.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kronos
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # wal_level/max_wal_senders/max_replication_slots are context=postmaster
    # (restart-required) GUCs, so they're baked in at cold boot.
    # synchronous_standby_names is deliberately NOT set here -- real,
    # reproduced finding (poc/postgres_replication/README.md "real finding
    # #2"): setting it from cold boot deadlocks this image's own
    # /docker-entrypoint-initdb.d database-creation bootstrap, since that's
    # a normal client transaction that would need a synchronous ack from a
    # standby that cannot exist yet. `postgres-replication-init` below
    # flips this on (reload-safe, no restart) once the replica is healthy.
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
    secrets: [db_password, replication_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check so dependents don't start during the
      # first-time initdb bootstrap (socket-only) before :5432 is listening.
      # start_period covers first-init, during which the TCP check legitimately
      # fails — otherwise retries are exhausted before the server is ready.
      test: ["CMD-SHELL", "pg_isready -U kronos -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s

  # Real Postgres 16 streaming replica (postgres:16-alpine, same pinned tag
  # as the primary), bootstrapped via `pg_basebackup -R` per
  # docker/postgres/replica-entrypoint.sh -- verified end-to-end against
  # this exact image in poc/postgres_replication/. Passive: the app never
  # connects here directly (see CLAUDE.md §F / this item's own report for
  # why no read-query routing was added).
  postgres-replica:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPL_USER: replicator
      REPLICA_APPLICATION_NAME: kronos_prod_replica
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    secrets: [replication_password]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # One-shot job (restart:"no", same pattern as `keycloak-init` below) that
  # flips the primary into synchronous replication mode once the replica is
  # confirmed healthy. See docker/postgres/replication-init.sh for the full
  # real-finding writeup of why this can't be a `command:` flag on
  # `postgres` at cold boot.
  postgres-replication-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      postgres-replica: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/replication-init.sh"]
    secrets: [db_password]
    volumes:
      - ./postgres/replication-init.sh:/replication-init.sh:ro

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kronos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_KEY:-}
      # Browsers PUT evidence directly to MinIO via presigned URLs; this is
      # cross-origin CORS, enforced server-side (MinIO's bucket-level
      # PutBucketCors API isn't implemented — this env var is the actual
      # supported mechanism). Must match kronos-backend's CORS_ALLOWED_
      # ORIGINS below. MinIO isn't published externally in this compose
      # file yet (see MINIO_PUBLIC_ENDPOINT), so this is a no-op until it is.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://${KEYCLOAK_HOSTNAME}}
    volumes:
      - minio_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - cluster.name=kronos-prod
      - node.name=kronos-node-1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      # NOT :ro -- real, reproduced finding (docker-compose.dev.yml's own
      # opensearch service has the full account): the security plugin's
      # bundled demo installer (install_demo_configuration.sh, runs at
      # every container start unless DISABLE_INSTALL_DEMO_CONFIG=true, which
      # this file does not set) APPENDS its own transport-SSL cert paths
      # into this same file; a read-only mount makes that append fail and
      # the security plugin crash-loops on missing cert paths. This file
      # itself (docker/opensearch/opensearch.yml) previously didn't exist
      # at all (access-management-review.md [C-2]) and now does, but this
      # mount is still relying on the bundled *demo* self-signed certs, not
      # real production TLS material -- tracked as a real, still-open gap,
      # not fixed here.
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml

  keycloak:
    # 26.2 (not 26.0): the organization-id token claim (addOrganizationId) the
    # backend's _extract_tenant requires only lands in 26.1+. Keep in sync with dev.
    image: quay.io/keycloak/keycloak:26.2
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kronos
      KC_DB_USERNAME: kronos
      KC_DB_PASSWORD: ${KRONOS_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-keycloak.kronos.example}
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
      KC_FEATURES: organization,token-exchange,fgap-v2
    volumes:
      - ./certs:/certs:ro

  # Ensures the KronOS organization exists via the Admin REST API (the same
  # approach as dev) — never via a realm-import organizations block, which
  # Keycloak 26.2 rejects with "Can not update organization group".
  # Assumes the realm is already provisioned. ORG_MEMBER_IDS is empty in prod:
  # real users join the org through the IdP / org domain, not by seeded ids.
  # Built (not bind-mounted) -- see docker/init/Dockerfile.keycloak-init for
  # why: curlimages/curl runs as non-root, and Docker Desktop/WSL2's
  # bind-mount layer doesn't reliably grant non-root container users read
  # access to host files, even when the real host file mode is 0755.
  keycloak-init:
    build:
      context: ..
      dockerfile: docker/init/Dockerfile.keycloak-init
    restart: "no"
    depends_on:
      - keycloak
    environment:
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
      KC_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ORG_NAME: ${KRONOS_ORG_NAME:-KronOS}
      ORG_ALIAS: ${KRONOS_ORG_ALIAS:-kronos}
      ORG_DESCRIPTION: KronOS production organization
      ORG_DOMAIN: ${KRONOS_ORG_DOMAIN:-}

  # Adds the openid authc domain (trusting Keycloak) and the generic DLS
  # tenant role to OpenSearch's security config -- the exact same one-time
  # cluster bootstrap docker-compose.dev.yml's opensearch-init runs, using
  # the identical shared script (scripts/provision_opensearch_security.py,
  # its own docstring already names this as "the single source of truth
  # shared by dev/prod compose and any future Helm provisioning Job").
  # Previously this compose file had NO equivalent of dev's opensearch-init
  # at all (roadmap I3 "SA/AD/ISM provisioning" gap) -- note the per-org
  # Security Analytics/Anomaly-Detection detectors and the ISM
  # rollover/index-template themselves do NOT need this step: those are
  # already auto-provisioned by the running backend/celery-worker (see
  # ensure_index_template/ensure_ism_policy in TimelineIngestionService,
  # ensure_org_detectors in the case-creation route, ensure_org_detector in
  # anomaly_scoring.py) using the same OPENSEARCH_URL/USERNAME/PASSWORD
  # already wired below -- that part already worked in this file before
  # this change. What was genuinely missing is this openid+DLS bootstrap,
  # which only the app's *tenant-scoped* Dashboards/DLS path depends on.
  opensearch-security-init:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      - opensearch
    volumes:
      - ../scripts/provision_opensearch_security.py:/provision_opensearch_security.py:ro
    environment:
      # Fixed 2026-08-10 (Gap Audit P0-1) -- same real scheme mismatch as
      # kronos-backend's own OPENSEARCH_URL above: OpenSearch here is
      # HTTPS-only (security plugin enabled, no ssl.http.enabled override).
      # provision_opensearch_security.py already builds its own
      # ssl.CERT_NONE context for the self-signed demo cert, so no other
      # change is needed alongside this scheme fix.
      OS_BASE: https://opensearch:9200
      OS_ADMIN_USER: ${OPENSEARCH_ADMIN_USER:-admin}
      OS_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required to bootstrap OpenSearch security}
      KC_BASE: http://keycloak:8080
      KC_REALM: kronos
    entrypoint: ["python3", "/provision_opensearch_security.py"]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes:
      - clamav_db:/var/lib/clamav
    # Reconciles clamd's own real stream/file/scan size ceiling with
    # KronOS's upload ceiling (src/config.py Settings.max_upload_bytes) --
    # identical mechanism to docker-compose.dev.yml (see
    # poc/clamav/README_large_file_fix.md for the full root-cause account:
    # without this, clamd's compiled-in 100 MB default silently closes the
    # INSTREAM connection -- BrokenPipeError -- on any real forensic image
    # above that size, even though KronOS itself accepts up to 5 GiB). The
    # clamav/clamav:stable image's own /init entrypoint reads any
    # CLAMD_CONF_<Setting> env var and rewrites the matching clamd.conf
    # directive -- verified against the real pinned image, not guessed.
    # Must stay >= MAX_UPLOAD_BYTES below (kronos-backend/celery-worker),
    # hence the single shared KRONOS_MAX_UPLOAD_BYTES var driving both.
    environment:
      CLAMD_CONF_StreamMaxLength: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      CLAMD_CONF_MaxFileSize: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      CLAMD_CONF_MaxScanSize: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  tsa:
    image: freetsa/freetsa:latest
    ports: ["318:318"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    # Browser-facing origin for each service's CSP allowance, rendered into
    # the CSP header by nginx's envsubst templating (see
    # docker/nginx/nginx.conf.template and the matching note on
    # kronos-backend's OPENSEARCH_DASHBOARDS_URL above). Set these to real
    # public hostnames for this deployment — BACKEND_PUBLIC_URL/
    # MINIO_PUBLIC_URL default empty (omitted from the CSP) since this
    # compose file doesn't publish those ports directly to the browser.
    environment:
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      OPENSEARCH_DASHBOARDS_URL: ${OPENSEARCH_DASHBOARDS_URL:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - kronos-backend

  # Real schema migrations (Gap Audit P1-12 / Milestone V4): a one-shot
  # `alembic upgrade head` run using the exact same built/pushed backend
  # image as kronos-backend/celery-worker below (command override only, no
  # separate image) -- mirrors this file's own keycloak-init/opensearch-
  # security-init one-shot-container pattern. This is now the ONLY schema-
  # mutating step in this deployment: kronos-backend/celery-worker no
  # longer call create_tables() at their own boot (see src/external/
  # startup.py and docs/DATABASE_MIGRATIONS.md). A production deploy MUST
  # run this (or an equivalent `docker compose run db-migrate` /
  # `alembic upgrade head` step in whatever orchestrator replaces Compose
  # for this environment) before rolling kronos-backend/celery-worker to a
  # new image that expects a new column/table.
  db-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD}@postgres:5432/kronos
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    command: alembic upgrade head

  kronos-backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    # NOTE: Every var below maps to a required field in src/config.py (Settings).
    # Settings() has no defaults for these — a missing/renamed var crashes boot.
    # SECURITY TODO (see docs/access-management-review.md):
    #   - MINIO_ACCESS_KEY/SECRET_KEY must be a *scoped service account*, not root.
    #   - tusd must use a separate put-only service account, not the backend's.
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD}@postgres:5432/kronos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Real, separate gap found while reconciling clamav's own
      # CLAMD_CONF_StreamMaxLength/MaxFileSize/MaxScanSize below with this
      # value (see clamav service comment + poc/clamav/README_large_file_fix.md):
      # this var was never set here at all, so the backend silently fell
      # back to src/config.py's compiled-in 5 GiB Python default. That
      # happens to equal clamd's own default ceiling today, but the two
      # would silently drift apart the moment anyone overrides
      # KRONOS_MAX_UPLOAD_BYTES (e.g. to raise the ceiling) without
      # touching this file — clamd would honor the new ceiling and accept
      # the larger stream, but the backend would still reject/mis-track it
      # at the old default. Mirrors docker-compose.dev.yml's identical var
      # on both kronos-backend and celery-worker (dev's own comment there
      # documents the same real 239 MB E01 upload root-cause trace).
      MAX_UPLOAD_BYTES: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      # MINIO_ENDPOINT is host:port only — startup.py prepends the scheme from MINIO_USE_TLS.
      MINIO_ENDPOINT: minio:9000
      # MinIO is not published outside the compose network here, so evidence
      # upload/finalize is not usable from a real browser until this is set
      # to a host the browser can reach (e.g. an MinIO ingress/LB hostname) —
      # presigned URLs are signed against this host (SigV4 signs Host), so it
      # cannot just be swapped after the fact. See MINIO_PUBLIC_ENDPOINT in
      # src/config.py / src/adapter/storage/s3.py.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio:9000}
      MINIO_USE_TLS: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      # Must match minio's MINIO_API_CORS_ALLOW_ORIGIN above. Defaults to the
      # Keycloak hostname as a best-guess prod domain — override with the
      # real frontend origin(s) if they differ (comma-separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${KEYCLOAK_HOSTNAME}}
      # Fixed 2026-08-10 (Gap Audit P0-1): was http://, but the `opensearch`
      # service above has the security plugin enabled with no
      # plugins.security.ssl.http.enabled override in docker/opensearch/
      # opensearch.yml, so it serves HTTPS-only on 9200 (identical to
      # docker-compose.dev.yml's own opensearch, which already correctly
      # uses https:// throughout) -- an http:// URL here could never
      # actually reach it. App-side cert verification is already correctly
      # relaxed for OpenSearch's self-signed demo cert
      # (verify_certs=False, src/external/startup.py), so no further
      # settings change is needed alongside this scheme fix.
      OPENSEARCH_URL: https://opensearch:9200
      # Non-superuser service account (a superuser bypasses OpenSearch DLS).
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-kronos_backend}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      # Real OpenSearch Security plugin is genuinely enabled on the `opensearch`
      # image/config above (unlike a DISABLE_SECURITY_PLUGIN=true dev-only
      # cluster) -- this was previously unset here (defaults False,
      # src/config.py), which silently skipped
      # TimelineIngestionService.ensure_generic_tenant_role() on every real
      # ingest. Mirrors docker-compose.dev.yml's own OPENSEARCH_SECURITY_ENABLED.
      OPENSEARCH_SECURITY_ENABLED: "true"
      # KEYCLOAK_URL = internal URL used to fetch JWKS; KEYCLOAK_PUBLIC_URL = issuer in the token.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Browser-facing OpenSearch Dashboards origin (e.g.
      # https://os.kronos.example) for the Timeline tab's iframe embed.
      # No OpenSearch Dashboards service is deployed by this compose file —
      # leave unset to disable the feature (503), or point it at wherever
      # Dashboards is actually reachable from the browser. Must match the
      # nginx service's OPENSEARCH_DASHBOARDS_URL (CSP frame-src) below.
      OPENSEARCH_DASHBOARDS_URL: ${OPENSEARCH_DASHBOARDS_URL:-}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      TSA_URL: http://tsa:318
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # Shared step-up ticket store — required because this service runs 2
      # replicas (audit M-4). The app bootstrap passes
      # build_step_up_ticket_store(settings) into create_app().
      STEP_UP_TICKET_STORE: redis
      # SIEM/SOAR outbound sink connectors + Defender inbound poll source
      # (roadmap Milestones R2-R4/Q4, wired 2026-08-09 Milestone S). All
      # optional -- ${VAR:-} defaults to empty/unset, which
      # configure_*_from_settings() (src/external/dependencies.py) treats
      # as an honest "not configured" state, never an error. See
      # docker/.env.example for what each one means. Names verified 1:1
      # against src/config.py's Settings field names.
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      CEF_SYSLOG_HOST: ${CEF_SYSLOG_HOST:-}
      CEF_SYSLOG_PORT: ${CEF_SYSLOG_PORT:-514}
      SENTINEL_DCE_ENDPOINT: ${SENTINEL_DCE_ENDPOINT:-}
      SENTINEL_DCR_IMMUTABLE_ID: ${SENTINEL_DCR_IMMUTABLE_ID:-}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      # Defender's poll source is only wired from the async startup path
      # (wire_dependencies_async(), which kronos-backend runs) --
      # deliberately not added to celery-worker below, see
      # wire_dependencies_sync()'s own 2026-08-09 comment in
      # src/external/startup.py for why (its OAuth2 client keeps a
      # process-lifetime httpx.AsyncClient that would not survive Celery's
      # per-task fresh-event-loop model safely).
      DEFENDER_TENANT_ID: ${DEFENDER_TENANT_ID:-}
      DEFENDER_CLIENT_ID: ${DEFENDER_CLIENT_ID:-}
      DEFENDER_CLIENT_SECRET: ${DEFENDER_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m
      restart_policy:
        condition: on-failure
        max_attempts: 3

  celery-worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-kron-os/kronos}/backend:${IMAGE_TAG:-latest}
    # celery_app.py instantiates Settings() at import — the same required
    # fields as the backend must be present or the worker crashes on boot.
    environment:
      DATABASE_URL: postgresql+asyncpg://kronos:${POSTGRES_PASSWORD}@postgres:5432/kronos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Real, reproduced finding (poc/evidence_intake_async/): this was
      # missing here even though kronos-backend has it -- process_intake
      # (validate/scan/hash/promote) now runs in THIS worker, not the
      # backend request thread, so an unreachable clamd here is what
      # actually matters. configure_clamav_from_settings() hard-fails
      # worker startup in production if clamd is unreachable (EVID-6) --
      # better a loud crash than silently scanning nothing.
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Same real gap as kronos-backend above (this is the service that
      # actually runs process_intake's clamd scan, so it must agree with
      # kronos-backend's value or the two silently drift the moment
      # KRONOS_MAX_UPLOAD_BYTES is overridden) -- mirrors
      # docker-compose.dev.yml's identical var on this same worker.
      MAX_UPLOAD_BYTES: "${KRONOS_MAX_UPLOAD_BYTES:-5368709120}"
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_TLS: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      # Fixed 2026-08-10 (Gap Audit P0-1) -- same real scheme mismatch as
      # kronos-backend's own OPENSEARCH_URL above.
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-kronos_backend}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      # This worker consumes q.index (dispatch_parse/finalize_evidence), which
      # is exactly the code path that calls
      # TimelineIngestionService.ensure_generic_tenant_role() -- the same
      # real gap fixed on kronos-backend above applies here too (it was
      # missing on this service specifically, even though kronos-backend
      # had it, and docker-compose.dev.yml sets it on ALL FOUR of its
      # backend/celery-worker/celery-worker-plaso services). Confirmed via
      # `grep -rn ensure_generic_tenant_role src/` that only
      # timeline_ingest.py calls it, and celery_app.py routes
      # dispatch_parse/finalize_evidence to q.index, which this worker
      # consumes (-Q q.parse.fast,q.index,q.intake below).
      OPENSEARCH_SECURITY_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      KEYCLOAK_REALM: kronos
      KEYCLOAK_CLIENT_ID: kronos-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      # SIEM/SOAR outbound sink connectors (roadmap Milestones R2-R4, wired
      # 2026-08-09 Milestone S -- see kronos-backend's identical block
      # above for the full comment). NOT including DEFENDER_* here on
      # purpose -- wire_dependencies_sync() (src/external/startup.py)
      # deliberately does not call configure_defender_poll_source_from_settings()
      # for this worker, see that function's own 2026-08-09 comment.
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      CEF_SYSLOG_HOST: ${CEF_SYSLOG_HOST:-}
      CEF_SYSLOG_PORT: ${CEF_SYSLOG_PORT:-514}
      SENTINEL_DCE_ENDPOINT: ${SENTINEL_DCE_ENDPOINT:-}
      SENTINEL_DCR_IMMUTABLE_ID: ${SENTINEL_DCR_IMMUTABLE_ID:-}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
    # Was a plain list-form `depends_on: [redis, postgres]` -- that form
    # only orders container *start*, it does not wait for readiness, which
    # is not good enough for db-migrate specifically: db-migrate is a
    # one-shot `restart: "no"` container that must fully EXIT successfully
    # (schema applied) before this worker's own boot (which no longer runs
    # create_tables() itself, see src/external/startup.py) can rely on the
    # schema existing. Converted to map form with explicit conditions
    # (matching kronos-backend's own depends_on above) for all three.
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    command: celery -A src.external.celery_app worker -Q q.parse.fast,q.index,q.intake -c 4
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g

secrets:
  db_password:
    external: true
  # Streaming replication (Gap Audit V10/X2a) -- dedicated password for the
  # `replicator` role, mirrors db_password's own external-secret pattern.
  replication_password:
    external: true

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  minio_data:
  opensearch_data:
  clamav_db:
