# Alembic configuration for KronOS (Gap Audit P1-12 / Milestone V4).
# See docs/DATABASE_MIGRATIONS.md for the real developer workflow.

[alembic]
# path to migration scripts.
script_location = %(here)s/migrations

# template used to generate migration file names -- includes a date prefix
# so `ls migrations/versions/` sorts chronologically, unlike the bare
# %(rev)s_%(slug)s default.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, prepended to sys.path -- repo root, so `migrations.*` and
# `src.*` imports both resolve the same way they do for every other
# entrypoint in this repo (PYTHONPATH=/app in docker/Dockerfile).
prepend_sys_path = .

path_separator = os

# database URL is intentionally NOT set here -- migrations/env.py reads the
# real DATABASE_URL from the environment (the same variable every real
# KronOS process already receives via docker-compose/Settings), never from
# a committed ini file. See migrations/env.py's own docstring.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# No post-write hooks: `migrations/` is deliberately OUT of this repo's
# ruff/mypy/black invocation scope (Makefile/CI run `ruff check src/
# tests/`, not the repo root -- see docs/DATABASE_MIGRATIONS.md), and a
# `black`-based hook here would fail whenever `alembic revision
# --autogenerate` runs in an environment that only has the main (non-dev)
# dependency group installed (e.g. a minimal migrate-only container),
# since `black` is a `[project.optional-dependencies].dev`-only tool.
# Run `black migrations/` by hand after generating a revision if desired.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
