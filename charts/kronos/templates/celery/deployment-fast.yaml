apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kronos.fullname" . }}-celery-fast
  namespace: kronos
  labels:
    {{- include "kronos.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-fast
spec:
  replicas: {{ .Values.celery.workers.fast.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kronos.name" . }}-celery-fast
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kronos.name" . }}-celery-fast
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: celery-fast
        # Distinct zone from the rest of the App tier (INFRA-008): parser
        # pods must not inherit deny-app-egress.yaml's broad "app -> entire
        # Data zone" allowance. See networkpolicies/parser-egress.yaml for
        # the dedicated MinIO-only policy that selects this label instead.
        app.kubernetes.io/zone: app-parser
      annotations:
        {{- include "kronos.vaultAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kronos.serviceAccountName" . }}
      automountServiceAccountToken: false
      runtimeClassName: {{ .Values.gvisorRuntimeClass }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-fast
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - src.external.celery_app
            - worker
            - -Q
            - {{ .Values.celery.workers.fast.queues | quote }}
            - -c
            - {{ .Values.celery.workers.fast.concurrency | quote }}
            - --loglevel=info
          env:
            {{- include "kronos.commonEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: kronos-app-secrets
          resources:
            {{- toYaml .Values.resources.celeryFast | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
