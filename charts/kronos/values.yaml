global:
  imageRegistry: ""
  storageClass: ""
  imagePullSecrets: []

image:
  repository: ghcr.io/kron-os/kronos-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  backend:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  celeryFast:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  celeryPlaso:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
  celeryIndex:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  celeryBeat:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  host: kronos.example.com
  tls: true
  certManager:
    enabled: true
    issuerName: step-ca-issuer
    issuerKind: ClusterIssuer

service:
  type: ClusterIP
  port: 8000

keycloak:
  url: https://auth.kronos.example.com
  realm: kronos
  clientId: kronos-backend
  existingSecret: kronos-keycloak-secret
  secretKey: client-secret
  # Ensure the KronOS organization exists via the Admin REST API (post-install
  # hook Job). Orgs are NEVER created via a realm-import block — Keycloak 26.2
  # rejects that with "Can not update organization group". Opt-in; the realm
  # must already exist. The pod needs egress to keycloak.url.
  provisionOrg:
    enabled: false
    image: curlimages/curl:latest
    backoffLimit: 6
    # Secret holding master-realm admin creds, keys: admin-user / admin-password
    adminSecret: kronos-keycloak-admin
    org:
      name: KronOS
      alias: kronos
      description: KronOS organization
      domain: ""        # optional; created as a verified org domain when set
      memberIds: ""     # optional space-separated user UUIDs to link as members

opensearch:
  url: https://opensearch:9200
  dashboardsUrl: https://dashboards.kronos.example.com
  existingSecret: kronos-opensearch-secret
  # Real OpenSearch Security plugin genuinely enabled on the cluster
  # opensearch.url points to (as opposed to a DISABLE_SECURITY_PLUGIN=true
  # dev-only cluster) -- gates
  # TimelineIngestionService.ensure_generic_tenant_role() in src/config.py
  # (Settings.opensearch_security_enabled, default False). Must be true for
  # any cluster with security enabled, or per-org DLS enforcement is
  # silently never provisioned. Mirrors docker-compose.{dev,prod}.yml's
  # identical OPENSEARCH_SECURITY_ENABLED var (a real, separate bug found
  # and fixed in docker-compose.prod.yml while wiring this same value here
  # -- it was missing on that file's celery-worker service even though the
  # backend service had it).
  securityEnabled: true
  # Post-install/upgrade hook Job that bootstraps OpenSearch's openid authc
  # domain (trusting keycloak.url/realm below) + the generic DLS tenant
  # role -- the Helm equivalent of docker-compose.{dev,prod}.yml's
  # opensearch-init / opensearch-security-init services. Reuses the
  # identical shared script (scripts/provision_opensearch_security.py,
  # chart-local copy at files/provision_opensearch_security.py because
  # Helm's .Files.Get cannot read outside the chart directory -- same
  # reason keycloak.provisionOrg below ships its own files/ copy). Opt-in
  # like keycloak.provisionOrg, for the same reason: it mutates
  # cluster-wide OpenSearch Security config using admin credentials, so an
  # operator should consciously enable it per environment rather than have
  # every `helm install` silently touch a shared cluster's security config.
  # NOTE: per-org Security Analytics/Anomaly-Detection detectors and the
  # ISM rollover policy/index template do NOT need this Job -- those are
  # already auto-provisioned at runtime by the running backend/celery
  # workers (ensure_index_template/ensure_ism_policy/ensure_org_detectors).
  # Only this cluster-level openid+DLS bootstrap step is genuinely missing
  # without it.
  securityInit:
    enabled: false
    image: python:3.12-alpine
    backoffLimit: 6
    # Secret holding OpenSearch Security superuser creds, keys:
    # admin-user / admin-password (the security plugin's own bootstrap
    # admin, NOT the kronos_backend service account referenced by
    # opensearch.existingSecret above -- that account is deliberately a
    # non-superuser so DLS actually applies to it).
    adminSecret: kronos-opensearch-admin

minio:
  endpoint: minio:9000
  useTls: true
  existingSecret: kronos-minio-secret

# ClamAV is NOT deployed as a Kubernetes resource by this chart -- the same
# convention already used for OpenSearch/Keycloak/Vault/MinIO/TSA above,
# none of which get a Deployment/Service here either (only postgresql/redis
# do, via the Bitnami subcharts below). All of those are referenced purely
# by endpoint value (opensearch.url, keycloak.url, minio.endpoint), assumed
# pre-provisioned by whatever manages this chart's target cluster. host/port
# here follow that identical pattern -- this is not a new architecture
# decision. Previously this chart had ZERO reference to ClamAV anywhere
# (roadmap I3: "Helm has no CLAMD_HOST wiring at all") -- confirmed via
# `grep -rn CLAMD charts/kronos/` before this change, zero hits. If the
# intent is instead for THIS chart to own and deploy the ClamAV instance
# itself (unlike Keycloak/Vault/etc.), that is a materially bigger, separate
# scope decision (Deployment + Service + PVC for the virus DB + its own
# resource/security-context template) that was NOT made here -- flagging
# for an explicit decision rather than silently picking one.
clamav:
  host: clamav
  port: 3310

# Real ceiling shared between the backend's own upload-size enforcement
# (src/config.py Settings.max_upload_bytes, MAX_UPLOAD_BYTES env var) and
# clamd's own StreamMaxLength/MaxFileSize/MaxScanSize -- see
# poc/clamav/README_large_file_fix.md and docker-compose.{dev,prod}.yml's
# identical KRONOS_MAX_UPLOAD_BYTES-driven vars for the full root-cause
# account (a real 239 MB E01 upload silently BrokenPipeError'd against
# clamd's compiled-in 100 MB default). This chart cannot enforce the
# corresponding ceiling on whatever external ClamAV instance clamav.host
# above actually points to -- that must be configured to match by whoever
# operates it, exactly as MAX_UPLOAD_BYTES here must be kept <= it.
maxUploadBytes: 5368709120

vault:
  addr: https://vault:8200
  role: kronos-backend
  agentInject: true

# Step-up (RFC 9470) ticket store. Use "redis" whenever replicaCount > 1 so
# tickets are shared across backend pods (audit M-4); "memory" is single-pod only.
stepUp:
  ticketStore: redis

celery:
  workers:
    fast:
      replicas: 2
      queues: "q.parse.fast"
      concurrency: 4
    plaso:
      replicas: 1
      queues: "q.parse.plaso"
      concurrency: 1
    index:
      replicas: 2
      # q.intake (process_intake: validate/scan/hash/promote) grouped here
      # with q.index (dispatch/finalize/beat orchestration) -- same
      # lightweight, non-CPU-bound class as those, distinct from the
      # actual parsing work on q.parse.fast/q.parse.plaso.
      queues: "q.index,q.intake"
      concurrency: 8

# Runs `alembic upgrade head` as a pre-install/pre-upgrade Helm hook Job
# (templates/backend/migrate-job.yaml) before the backend Deployment is ever
# created or updated -- see that template's own comment for the full
# reasoning (Milestone V4 / Gap Audit P1-12). Enabled by default, UNLIKE
# keycloak.provisionOrg and opensearch.securityInit above (both opt-in):
# those mutate a shared *external* system's own state (a live Keycloak
# realm, a live OpenSearch cluster) that an operator may deliberately not
# want touched by every install/upgrade, whereas a migrated schema is not
# optional for this application to function at all -- an un-migrated
# install is just broken, not a valid alternate configuration.
migrate:
  enabled: true
  backoffLimit: 3

gvisorRuntimeClass: "gvisor"
firecrackerRuntimeClass: "firecracker"

networkPolicies:
  enabled: true

postgresql:
  enabled: true
  # Streaming replication (Gap Audit V10 / X2a): 1 primary + 1 synchronous
  # read replica, per docs/POSTGRES_MINIO_HA_RESEARCH.md §1.5 verdict --
  # "adopt the replication half now, defer automatic failover". Real
  # topology verified against the resolved bitnami/postgresql chart
  # 18.8.9 (see poc/postgres_replication/README.md); no application code
  # change required -- the app still connects to the primary service only.
  architecture: replication
  auth:
    database: kronos
    username: kronos
    existingSecret: kronos-postgres-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  replication:
    # remote_apply/on both require a live sync standby to acknowledge before
    # commit returns; "on" is the documented minimum for "no committed
    # transaction is lost unless both primary and standby suffer storage
    # corruption" (V10 §1.2) without remote_apply's larger commit-latency
    # cost.
    #
    # COLD-START CAVEAT (real, empirically confirmed against the pinned
    # bitnami/postgresql image via `docker run`, not assumed -- see
    # poc/postgres_replication/README.md "real finding #2" and
    # docs/deployment.md's "Postgres streaming replication cold-start
    # note"): with numSynchronousReplicas=1 already active on a FRESH
    # install, any real write (Alembic migrations, Keycloak schema setup)
    # blocks indefinitely until the read-replica pod finishes its own
    # bootstrap and starts streaming. For a first install, either set
    # numSynchronousReplicas=0 initially and `helm upgrade` to 1 once the
    # replica is confirmed streaming (synchronous_standby_names has
    # context=sighup -- reload-safe, no restart), or accept a one-time
    # delay on first migration/schema-setup jobs. Subsequent upgrades of an
    # already-running cluster are unaffected.
    #
    # STEADY-STATE VERSION OF THE SAME RISK (Gap Audit Milestone LL, real
    # PoC: poc/postgres_sync_replica_failure/): this isn't only a
    # cold-start caveat -- if the replica becomes unreachable AFTER a
    # successful install (network partition, replica crash/overload), the
    # same "blocks indefinitely, no timeout" behavior recurs for as long
    # as the standby is unreachable, degrading write availability
    # platform-wide (not just replication redundancy). See
    # docs/POSTGRES_MINIO_HA_RESEARCH.md §1.6 for the full writeup and the
    # real, undecided project-owner question this raises (accept as-is /
    # add a monitored synchronous_commit fallback / add replication-lag
    # alerting).
    synchronousCommit: "on"
    numSynchronousReplicas: 1
    # Shared application_name both the primary and the read replica are
    # configured with (confirmed via `helm template`: both
    # primary/statefulset.yaml and read/statefulset.yaml render
    # POSTGRES_CLUSTER_APP_NAME from this same value) -- this is what
    # synchronous_standby_names actually matches against, not "the
    # primary's own name".
    applicationName: kronos_replica
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  readReplicas:
    replicaCount: 1
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# Redis DB-role separation (Milestone X2b, executing docs/
# REDIS_BLAST_RADIUS_RESEARCH.md W5 §6.1's already-decided "adopt now"
# verdict). The single `redis:` block below (one Bitnami subchart instance,
# all four DB roles multiplexed onto it -- DB0 step-up, DB1 Celery broker,
# DB2 Celery result backend, DB3 stream-ingest) is replaced by TWO aliased
# instances of the same dependency (Chart.yaml), matching the brief's own
# suggested pairing and docker-compose.prod.yml's real split:
#   - redis-auth-streams: DB0 (step-up tickets) + DB3 (stream-ingest) --
#     the two customer/telemetry-facing roles.
#   - redis-celery: DB1 (Celery broker) + DB2 (Celery result backend) --
#     the internal task-plumbing roles.
# This also resolves W5's R4 finding (a large DB3 stream backlog no longer
# shares one instance's memory ceiling with DB0/DB1's write-availability-
# sensitive workloads). Zero src/ changes needed -- src/config.py already
# models redis_url/celery_broker_url/celery_result_backend/stream_redis_db
# as independent DSNs (W5 §3.1); only the two hostnames + kronos-app-secrets
# values need to change (see docs/deployment.md's secret-creation snippet).
#
# Two SEPARATE existingSecrets (not one REDIS_PASSWORD reused) chosen
# deliberately: the whole point of this split is blast-radius/credential
# isolation between the customer-facing and internal-plumbing role groups,
# so a leaked/rotated auth+streams password should not also be a live
# Celery broker/backend credential, and vice versa -- reusing one secret
# across both instances would silently reintroduce a shared-fate dependency
# this milestone exists to remove. Same per-instance persistence/resource
# sizing as the original single instance (no capacity remodeling attempted
# here -- that would need real load data, out of this item's scope per W5
# §5.1, which only asked for role separation, not capacity re-tuning).
redis-auth-streams:
  enabled: true
  auth:
    enabled: true
    existingSecret: kronos-redis-auth-streams-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      size: 8Gi
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

redis-celery:
  enabled: true
  auth:
    enabled: true
    existingSecret: kronos-redis-celery-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      size: 8Gi
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

nginx:
  image:
    repository: nginx
    tag: alpine
  replicaCount: 2
  # Browser-facing origins for the CSP header's connect-src (see
  # templates/nginx/configmap.yaml). Default empty, matching
  # docker-compose.prod.yml's own default: neither the backend nor MinIO is
  # published directly to browsers in this chart's ingress topology (nginx
  # is the sole DMZ-facing entry point), so both collapse to nothing.
  backendPublicUrl: ""
  minioPublicUrl: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
