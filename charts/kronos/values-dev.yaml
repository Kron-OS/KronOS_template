replicaCount: 1

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  tls: false
  host: localhost
  certManager:
    enabled: false

keycloak:
  url: http://keycloak:8080
  existingSecret: ""
  provisionOrg:
    enabled: true
    adminSecret: kronos-keycloak-admin
    org:
      name: KronOS Dev
      alias: kronos-dev
      description: Default development organization
      domain: kronos.dev
      memberIds: ""

opensearch:
  url: http://opensearch:9200
  dashboardsUrl: http://opensearch-dashboards:5601

minio:
  useTls: false
  existingSecret: ""

vault:
  agentInject: false

celery:
  workers:
    fast:
      replicas: 1
    plaso:
      replicas: 1
    index:
      replicas: 1

networkPolicies:
  enabled: false

postgresql:
  # Dev doesn't need replication (docs/POSTGRES_MINIO_HA_RESEARCH.md §1.5
  # scope: prod-topology concern only) -- explicitly override the base
  # values.yaml's `architecture: replication` back to standalone so dev
  # doesn't stand up a second Postgres pod it has no use for.
  architecture: standalone
  auth:
    password: kronos_dev_password

# Split to match values.yaml's redis-auth-streams/redis-celery aliases
# (Milestone X2b). Dev uses inline `auth.password` (no existingSecret) same
# as postgresql.auth.password above -- fine for a throwaway dev install.
redis-auth-streams:
  auth:
    password: kronos_dev_password
redis-celery:
  auth:
    password: kronos_dev_password
