# KronOS sandbox — a hardened, network-isolated box to exercise the whole
# pipeline (parsers, Plaso heavy path, tests, lint/type) and attach to from
# outside via SSH / the Claude Code CLI.
#
#   cp sandbox/.env.example sandbox/.env   # then paste your SSH public key
#   docker compose -f sandbox/docker-compose.yml up -d --build
#   ssh -p 50923 root@127.0.0.1            # or: docker exec -it kronos-sandbox bash
#
# Isolation summary:
#   - mounts ONLY this repo (nothing else on your machine is visible);
#   - uses Sysbox runtime for full root access inside with host isolation;
#   - a start-up firewall blocks the local network (LAN/host/other containers)
#     while still allowing the public internet and inbound SSH.

name: kronos-sandbox

services:
  sandbox:
    build:
      # Repo root, so the image can install project deps from pyproject.toml.
      context: ..
      dockerfile: sandbox/Dockerfile
    image: kronos-sandbox:dev
    container_name: kronos-sandbox
    hostname: kronos-sandbox
    env_file:
      - .env
    ports:
      # SSH. Bound to host loopback by default so the box is NOT exposed on your
      # LAN. To reach it from another machine, prefer an SSH tunnel; only change
      # this to "50923:22" if you understand you're exposing it on the host's
      # network interfaces.
      - "50923:22"
    volumes:
      # The ONLY host path mounted: this repository. No other repo is visible.
      - ..:/root/kronos:rw
      # Persistent home so Claude Code creds / shell history survive restarts.
      # (Layered under the repo mount above; the more specific path wins.)
      - sandbox_home:/root
    networks:
      - sandbox_net

    # --- Sysbox isolation ---
    # Sysbox provides a rootful container with its own kernel view (user namespaces),
    # so you get root access inside (for iptables, sshd chroot, etc.) without
    # exposing host root privileges. No manual cap_drop/cap_add needed.
    runtime: sysbox-runc

    tmpfs:
      # Writable scratch that plaso/pytest need, kept off any persistent layer.
      - /tmp:exec,mode=1777,size=2g
    pids_limit: 4096
    mem_limit: 6g
    restart: unless-stopped

networks:
  sandbox_net:
    driver: bridge
    # internet allowed at the network layer; the in-container firewall blocks
    # the LAN. For a FULL air-gap (no internet either), set this to true — but
    # note published ports stop working, so attach via `docker exec` instead.
    internal: false
    ipam:
      config:
        # A deliberately uncommon subnet, unlikely to collide with a home/office
        # LAN, so the firewall's private-range blocks don't fight real routing.
        - subnet: 172.31.253.0/24

volumes:
  sandbox_home: