[Unit]
# Refuse to accept SSH connections until the egress firewall is up and the
# box is provisioned (host keys, authorized_keys). Matches the old
# entrypoint.sh's "fatal, refuse to start unprotected" behaviour, expressed
# as unit ordering/dependencies instead of a shell script exit.
Requires=kronos-firewall.service kronos-provision.service
After=kronos-firewall.service kronos-provision.service
