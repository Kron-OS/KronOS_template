[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kronos"
version = "0.1.0"
description = "Forensically sound, multi-tenant evidence management and forensic timeline analysis platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "boto3>=1.34",
    "aiobotocore>=2.13",
    "opensearch-py[async]>=2.6",
    "python-jose[cryptography]>=3.4",  # P2-SEC-4: 3.4.0 fixes CVE-2024-33663/-33664
    "httpx>=0.27",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "clamd>=1.0.2",
    "evtx>=0.8",
    "rfc3161ng>=2.1.3",
    "pyyaml>=6.0",
    "yara-x==1.19.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    # Gap Audit Milestone AAA: these three were previously unpinned lower
    # bounds (">="), so every fresh `pip install -e ".[dev]"` (CI included)
    # silently picked up whatever the latest release happened to be that
    # day. In practice this already caused real drift: main's own last CI
    # run (2026-07-29, commit 673b29ef) failed `ruff check` outright, and a
    # fresh install of ruff 0.16.4/black 26.5.1 against this exact tree
    # found 68 real ruff violations plus black wanting to reformat every
    # file whose formatting a different black release had produced --
    # neither reflects an actual code regression, both reflect the tooling
    # itself moving under an unpinned constraint. Exact-pinned to the
    # versions verified clean against this tree (ruff 0.16.4; black 24.4.2,
    # chosen over 26.5.1 because it agrees with mypy's own already-documented
    # 2.x-era codebase decisions and required reformatting only genuinely
    # non-compliant files, not the whole tree; mypy 2.3.1, confirmed to
    # reproduce the pre-existing, already-known 29-error baseline exactly).
    # Bump deliberately, by re-running the full suite and inspecting the
    # diff, not by loosening this back to "latest chases itself" via ">=".
    "mypy==2.3.1",
    "ruff==0.16.4",
    "black==24.4.2",
    "testcontainers[postgres,minio]>=4.5",
    "factory-boy>=3.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=src", "--cov=kronos_attest", "--cov-report=term-missing", "--cov-fail-under=80"]
markers = [
    "integration: requires Docker (Postgres + MinIO containers)",
    "security_stack: requires the full security-enabled docker-compose.test.yml stack (real OpenSearch security plugin + real Keycloak org) -- see poc/ci_security_enabled_stack/ and .github/workflows/security-integration-tests.yml (Gap Audit P1-14 / V3)",
    "admin_routes_real_keycloak: requires a real, reachable Keycloak instance (default: the shared dev-stack Keycloak at localhost:8080) -- see poc/admin_routes_real_keycloak/README.md (Gap Audit P1-15 / V5)",
]

[tool.coverage.run]
omit = [
    "src/config.py",                              # pydantic-settings; needs real env vars
    "src/adapter/repository/postgres_*.py",       # infrastructure; covered by integration tests
    "src/adapter/storage/s3.py",                  # infrastructure; covered by integration tests
    "src/adapter/queue/celery_queue.py",          # infrastructure; needs real Celery broker
    "src/external/celery_app.py",                 # infrastructure; needs real Celery broker
    "src/external/middleware/keycloak_auth.py",   # needs live Keycloak JWKS endpoint
    "src/external/middleware/opensearch_isolation.py",  # covered by integration tests
    "src/external/middleware/query_isolation.py",       # covered by integration tests
    "src/external/parsers/evtx.py",                    # needs evtx binary + real EVTX files
    "src/external/parsers/plaso.py",                   # needs Plaso installed in Firecracker container
    "src/external/sandbox/firecracker.py",             # needs subprocess + plaso worker binary
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Pydantic v2 BaseModel subclassing is not understood by mypy 2.x without the
# plugin (pydantic.mypy is incompatible with mypy 2.x). Suppress [misc] in
# model-heavy files to avoid noise.
[[tool.mypy.overrides]]
module = [
    "src.domain.*",
    "src.external.routes.*",
    "src.external.fastapi_app",
    "src.config",
]
disable_error_code = ["misc", "no-any-return", "untyped-decorator"]

# Same root cause (no pydantic.mypy plugin), different symptom: these files
# construct TimelineRecord via a dict-unpack (**{"@timestamp": ts}) mixed
# with keyword args for aliased fields (e.g. event_original=...,
# alias="event.original", model_config populate_by_name=True). mypy's
# synthesized __init__ can't verify either the dict-unpack's value types or
# that populate_by_name permits the plain field name as a keyword, even
# though both are correct at runtime -- confirmed by real parser PoCs
# (poc/plaso_opensearch/, poc/opensearch/) actually ingesting real records
# built this exact way.
[[tool.mypy.overrides]]
module = [
    "src.external.parsers.*",
    "src.external.sandbox.firecracker",
    "src.application.stream_normalization",
]
disable_error_code = ["call-arg", "arg-type"]

# Celery's own @app.task decorator has no type stubs, matching the
# untyped-decorator suppression already applied to routes.* above for the
# same reason (FastAPI's own decorators).
[[tool.mypy.overrides]]
module = ["src.external.celery_app"]
disable_error_code = ["untyped-decorator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.ruff.lint.per-file-ignores]
# camelCase fields are intentional here, not a naming-convention slip: these
# DTOs mirror the frontend TypeScript client's own field names verbatim
# (this repo's "fix/evidence-upload-camelcase" branch exists specifically
# to keep them that way). Renaming to snake_case would silently break the
# frontend contract, not fix a bug.
"src/external/routes/admin.py" = ["N815", "B008"]
"src/external/routes/cases.py" = ["N815", "B008"]
"src/external/routes/evidence.py" = ["N815"]
"src/external/routes/detections.py" = ["N815"]
"src/external/routes/sse.py" = ["N815"]
"src/external/routes/step_up.py" = ["N815"]
"src/external/routes/integration_source_push.py" = ["N815"]
"src/external/routes/admin_integration_sources.py" = ["N815"]
"src/external/routes/admin_connector_status.py" = ["N815"]
# Gap Audit Milestone AAA: EventOutcomeOut here is structurally identical to
# integration_source_push.py's own (same accepted/duplicate/messageId
# shape) -- missed when the sibling route got this ignore, not a
# deliberate omission.
"src/external/routes/collector_ingest.py" = ["N815"]
# FastAPI's Depends(...)/Query(...)/Body(...) default-argument pattern is
# the framework's own dependency-injection mechanism, not a mutable-default
# bug -- B008 ("no function calls in argument defaults") is a real check
# for the general case but a standard, documented false positive for
# FastAPI route/dependency signatures specifically.
"src/external/middleware/rbac.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[project.scripts]
kronos-attest = "kronos_attest.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src", "kronos_attest"]
