# Standalone PoC stack -- self-contained, does not depend on the real dev
# stack. Isolated project name/ports so this can run alongside the real
# dev-compose Vault (or another agent's PoC) on the same host without
# collision -- same convention as poc/vault_kes_minio/run_poc.sh.
name: kronos-poc-vaultconnectors
services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports: ["18220:8200"]
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://localhost:8200 vault status 2>/dev/null || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17
    restart: "no"
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        vault secrets enable -path=kronos-connectors -version=2 kv
        vault policy write kronos-connectors-app - <<'POLICY'
        path "kronos-connectors/data/*"     { capabilities = ["create","read","update","delete"] }
        path "kronos-connectors/metadata/*" { capabilities = ["read","list","delete"] }
        POLICY
        vault auth enable approle
        vault write auth/approle/role/kronos-connectors-app \
          policies=kronos-connectors-app \
          token_ttl=1h \
          token_max_ttl=4h
        echo "=== role_id ==="
        vault read auth/approle/role/kronos-connectors-app/role-id
        echo "=== secret_id ==="
        vault write -f auth/approle/role/kronos-connectors-app/secret-id
        echo "kronos-connectors Vault mount initialized successfully."
