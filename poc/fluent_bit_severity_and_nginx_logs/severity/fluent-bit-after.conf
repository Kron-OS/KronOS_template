# PoC "after" config -- the real P1-5 fix, applied verbatim to
# docker/fluent-bit/fluent-bit.conf's own SERVICE/FILTER/OUTPUT structure
# (trimmed to only what this severity test exercises).
#
# Mechanism chosen (verified against the real fluent/fluent-bit:3.1.10
# binary, see ../README.md "Mechanism chosen" section): five `modify`
# filters, each gated by a real `Condition Key_Value_Equals level <value>`
# clause, each `Set`-ing a NEW field `severity_num` to the real RFC 5424
# numeric severity (RFC 5424 section 6.2.1) for that level. Chosen over a
# `lua` filter because it needs no extra mounted script file (this repo's
# fluent-bit.conf is bind-mounted as a single file, no script directory),
# and over rewriting `level` in place because a new field is
# non-destructive -- OpenSearch OUTPUTs and anything else reading the
# original `level` string are unaffected.

[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      2020
    Parsers_File   /fluent-bit/etc/parsers.conf

[INPUT]
    Name           tail
    Tag            kronos.backend
    Path           /var/log/kronos-poc/app.log
    Parser         json
    Mem_Buf_Limit  10MB
    Skip_Long_Lines On

# Real KronOS structured-logger level strings this repo actually emits
# (verified via structlog.stdlib.map_method_name + `grep -rhoE
# "logger\.(debug|info|warning|error|critical|exception)\(" src/` --
# "warn" is NEVER emitted: structlog normalizes the deprecated .warn() alias
# to "warning" before add_log_level runs; .exception() normalizes to
# "error"). RFC 5424 section 6.2.1 numeric severities.
[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level debug
    Set            severity_num 7

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level info
    Set            severity_num 6

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level warning
    Set            severity_num 4

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level error
    Set            severity_num 3

[FILTER]
    Name           modify
    Match          kronos.*
    Condition      Key_Value_Equals level critical
    Set            severity_num 2

# → real local UDP syslog receiver (udp_syslog_receiver.py) on the host,
# reached via --network host on the fluent-bit container.
[OUTPUT]
    Name           syslog
    Match          kronos.*
    Host           127.0.0.1
    Port           5514
    Mode           udp
    Syslog_Format  rfc5424
    Syslog_Severity_Key  severity_num
    Syslog_Appname_Key   service

[OUTPUT]
    Name           stdout
    Match          kronos.*
    Format         json_lines
