# PoC "before" config -- reproduces the real P1-5 bug exactly as it exists
# today in docker/fluent-bit/fluent-bit.conf's syslog OUTPUT block
# (`Syslog_Severity_Key level`, fed a keyword string, never a number).
# Trimmed to only the INPUT/OUTPUT pair needed to reproduce it; the
# Parsers_File fix (already landed at Milestone S) is kept since it's a
# prerequisite for the JSON parsing this test also depends on.

[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      2020
    Parsers_File   /fluent-bit/etc/parsers.conf

[INPUT]
    Name           tail
    Tag            kronos.backend
    Path           /var/log/kronos-poc/app.log
    Parser         json
    Mem_Buf_Limit  10MB
    Skip_Long_Lines On

# → real local UDP syslog receiver (udp_syslog_receiver.py) on the host,
# reached via --network host on the fluent-bit container.
[OUTPUT]
    Name           syslog
    Match          kronos.*
    Host           127.0.0.1
    Port           5514
    Mode           udp
    Syslog_Format  rfc5424
    Syslog_Severity_Key  level
    Syslog_Appname_Key   service

[OUTPUT]
    Name           stdout
    Match          kronos.*
    Format         json_lines
