# Real fluent-bit 3.1 config for the Suricata/Zeek live-tail PoC (roadmap Q3).
#
# Mirrors this repo's own docker/fluent-bit/fluent-bit.conf `tail` input
# pattern exactly (Name tail / Tag / Path / Parser json / Mem_Buf_Limit /
# Skip_Long_Lines), applied to a Suricata eve.json file and a Zeek conn.log
# file instead of KronOS's own logs, and forwards via `http` output to
# KronOS's real IntegrationSource PUSH route instead of the existing
# opensearch/syslog outputs.
#
# Real, previously-unverified gap found and fixed here (CLAUDE.md SS F):
# this repo's own docker/fluent-bit/fluent-bit.conf uses `Parser json` on
# every `tail` input but never sets `Parsers_File` in [SERVICE] -- without
# it, a real fluent-bit 3.1 container logs
# "[error] [input:tail:tail.0] parser 'json' is not registered" and the
# `tail` input's Parser directive is silently never applied, meaning the
# repo's own existing config likely never actually JSON-parsed anything at
# runtime, real or not. Flagged, not fixed in that file (out of this
# connector's scope, mirrors Q2's own precedent for out-of-scope infra
# findings) -- fixed here by adding the missing directive.

[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    Parsers_File   /fluent-bit/etc/parsers.conf

# -----------------------------------------------------------------------
# INPUTS
# -----------------------------------------------------------------------

[INPUT]
    Name           tail
    Tag            kronos.suricata
    Path           /var/log/suricata/eve.json
    Parser         json
    Read_from_Head Off
    Mem_Buf_Limit  5MB
    Skip_Long_Lines On

[INPUT]
    Name           tail
    Tag            kronos.zeek
    Path           /var/log/zeek/conn.log
    Parser         json
    Read_from_Head Off
    Mem_Buf_Limit  5MB
    Skip_Long_Lines On

# -----------------------------------------------------------------------
# OUTPUTS
# -----------------------------------------------------------------------

# -> KronOS IntegrationSource PUSH: Suricata eve.json
[OUTPUT]
    Name           http
    Match          kronos.suricata
    Host           kronos-poc-suricatazeek-receiver
    Port           8000
    URI            /api/integrations/push/suricata-eve
    Format         json_lines
    Header         X-KronOS-Source-Key kronos-poc-suricata-demo-key
    tls            Off
    Retry_Limit    5

# -> KronOS IntegrationSource PUSH: Zeek conn.log
[OUTPUT]
    Name           http
    Match          kronos.zeek
    Host           kronos-poc-suricatazeek-receiver
    Port           8000
    URI            /api/integrations/push/zeek-conn-log
    Format         json_lines
    Header         X-KronOS-Source-Key kronos-poc-zeek-demo-key
    tls            Off
    Retry_Limit    5

# -> stdout for local debugging/capture
[OUTPUT]
    Name           stdout
    Match          kronos.*
    Format         json_lines
