version: "3.9"

# PoC for CLAUDE.md Section F: Vault Transit -> KES -> MinIO SSE-KMS chain.
# Mirrors docker/vault/docker-compose.vault.yml and docker/kes/docker-compose.kes.yml
# from the repo (same images, same vault-init script, same kes-config.yml logic)
# but on isolated container names/ports/network so it doesn't collide with the
# real dev stack or other agents' PoCs. Also adds the MinIO service with the
# MINIO_KMS_KES_* wiring that docker/docker-compose.dev.yml does NOT currently
# have (see poc README "Gap found").

networks:
  default:
    name: kronos-poc-vaultkes-net

services:
  vault:
    container_name: kronos-poc-vaultkes-vault
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: kronos-poc-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "18200:8200"
    command: vault server -dev
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://localhost:8200 vault status 2>/dev/null || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Verbatim entrypoint script from docker/vault/docker-compose.vault.yml's
  # vault-init service (transit engine + kronos-evidence key + policy + approle).
  vault-init:
    container_name: kronos-poc-vaultkes-vault-init
    image: hashicorp/vault:1.17
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: kronos-poc-root-token
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        vault secrets enable transit 2>/dev/null || echo "transit already enabled"
        vault write -f transit/keys/kronos-evidence type=aes256-gcm96 2>/dev/null || echo "key already exists"
        vault policy write kronos-kes - <<'POLICY'
        path "transit/keys/kronos-evidence" { capabilities = ["read"] }
        path "transit/encrypt/kronos-evidence" { capabilities = ["update"] }
        path "transit/decrypt/kronos-evidence" { capabilities = ["update"] }
        path "transit/generate-data-key/kronos-evidence" { capabilities = ["update"] }
        path "transit/datakey/plaintext/kronos-evidence" { capabilities = ["update"] }
        POLICY
        vault auth enable approle 2>/dev/null || echo "approle already enabled"
        vault write auth/approle/role/kronos-kes \
          policies=kronos-kes \
          token_ttl=1h \
          token_max_ttl=4h 2>/dev/null || echo "role already exists"
        echo "Vault initialized successfully."

  kes:
    container_name: kronos-poc-vaultkes-kes
    image: minio/kes:2024-06-17T15-47-05Z
    command: server --config /etc/kes/kes-config.yml
    environment:
      VAULT_APPROLE_ID: ${VAULT_APPROLE_ID}
      VAULT_APPROLE_SECRET: ${VAULT_APPROLE_SECRET}
    volumes:
      - ./kes-config.yml:/etc/kes/kes-config.yml:ro
      - ./certs/kes-server.crt:/etc/kes/certs/server.crt:ro
      - ./certs/kes-server.key:/etc/kes/certs/server.key:ro
      - ./certs/ca.crt:/etc/kes/certs/ca.crt:ro
    ports:
      - "17373:7373"
    depends_on:
      vault:
        condition: service_healthy
    # No usable in-container healthcheck: the kes image ships neither curl/wget
    # nor a CLI auth path that doesn't require a pre-provisioned API key
    # (`kes status` demands MINIO_KES_API_KEY). This is itself a minor real
    # finding -- verified by hand below, not asserted.

  minio:
    container_name: kronos-poc-vaultkes-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kronos_minio
      MINIO_ROOT_PASSWORD: kronos_minio_dev_password
      # --- The wiring docker/docker-compose.dev.yml does NOT have today ---
      MINIO_KMS_KES_ENDPOINT: https://kes:7373
      MINIO_KMS_KES_KEY_NAME: kronos-evidence
      MINIO_KMS_KES_CERT_FILE: /root/.minio/certs/minio-client.crt
      MINIO_KMS_KES_KEY_FILE: /root/.minio/certs/minio-client.key
      MINIO_KMS_KES_CAPATH: /root/.minio/certs/ca.crt
    volumes:
      - ./data:/data
      - ./certs/minio-client.crt:/root/.minio/certs/minio-client.crt:ro
      - ./certs/minio-client.key:/root/.minio/certs/minio-client.key:ro
      - ./certs/ca.crt:/root/.minio/certs/ca.crt:ro
    ports:
      - "29100:9000"
      - "29101:9001"
    depends_on:
      kes:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
