name: Build & Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t kronos-backend:${{ github.sha }} -f docker/Dockerfile .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kronos-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Gate: fail the job (and therefore block push-image, which needs
          # trivy-scan) on any CRITICAL/HIGH finding. Without this the scan
          # was purely observational and vulnerable images shipped anyway
          # (INFRA-004).
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # Always upload the SARIF for visibility in the Security tab, even
        # though the step above already failed the job on CRITICAL/HIGH.
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: kronos-backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json

  push-image:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Download SBOM generated by trivy-scan
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Attach SBOM to image as a Cosign attestation
        # Keyless OIDC signing, same as the "Sign image with Cosign" step
        # above — the SBOM was previously only a GitHub Actions artifact
        # (never attached to the image itself), so nothing could verify it
        # against the shipped digest (INFRA-012).
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
