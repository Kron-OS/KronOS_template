name: Build & Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gap Audit Milestone WWW (2026-08-30): matrixed over both real images
  # this repo ships. Previously this job only ever built/scanned/signed
  # docker/Dockerfile (-> the "backend" image) -- docker/Dockerfile.plaso-worker
  # (Plaso 20260512 + volatility3 2.28.0, what docker-compose.prod.yml's new
  # celery-worker-plaso service needs to run any real HEAVY-tier parser)
  # was never built anywhere in CI, so no image existed for that service to
  # reference at all. A matrix (not a duplicated second job) keeps both
  # images going through the identical scan/SBOM/sign/attest pipeline with
  # one definition, so a future third image variant is one `include:` line,
  # not a copy-pasted job.
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/Dockerfile
          - image: plaso-worker
            dockerfile: docker/Dockerfile.plaso-worker
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -t kronos-${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Trivy vulnerability scan
        # Gap Audit Milestone AAA: was pinned to @master -- a floating branch
        # reference, not a tag. Every other action in this workflow is at
        # least pinned to a released version; @master meant any new commit
        # to aquasecurity/trivy-action's default branch would run immediately
        # in this job with security-events: write + Docker build access, with
        # no reviewed release boundary at all. Pinned to the commit SHA of
        # the real, current v0.36.0 release (confirmed via the GitHub API:
        # v0.36.0's tag object dereferences to this commit, tag itself is a
        # verified/signed annotated tag) -- action.yaml at this SHA confirmed
        # to still accept image-ref/format/output/severity/exit-code
        # unchanged, so no other change was needed.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kronos-${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          # Gate: fail the job (and therefore block push-image, which needs
          # trivy-scan) on any CRITICAL/HIGH finding. Without this the scan
          # was purely observational and vulnerable images shipped anyway
          # (INFRA-004).
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        # Always upload the SARIF for visibility in the Security tab, even
        # though the step above already failed the job on CRITICAL/HIGH.
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: ${{ matrix.image }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: kronos-${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ github.sha }}
          path: sbom-${{ matrix.image }}.spdx.json

  push-image:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/Dockerfile
          - image: plaso-worker
            dockerfile: docker/Dockerfile.plaso-worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

      - name: Download SBOM generated by trivy-scan
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

      - name: Attach SBOM to image as a Cosign attestation
        # Keyless OIDC signing, same as the "Sign image with Cosign" step
        # above — the SBOM was previously only a GitHub Actions artifact
        # (never attached to the image itself), so nothing could verify it
        # against the shipped digest (INFRA-012).
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom-${{ matrix.image }}.spdx.json \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
