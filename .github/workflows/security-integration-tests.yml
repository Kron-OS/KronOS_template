name: Security-Enabled Integration Tests

# Gap Audit P1-14 / Milestone V, item V3. Runs the real,
# security-enabled docker/docker-compose.test.yml profile (OpenSearch
# security plugin genuinely on + real Keycloak org provisioning) -- see
# poc/ci_security_enabled_stack/README.md for the real, measured
# resource-fit investigation and the reasoning behind the cadence below.
#
# Deliberately scheduled/nightly + manual, NOT a per-PR gate, even though
# this workflow's own local-equivalent measurement (poc/ci_security_enabled_stack/
# output.txt: ~46s wall time, ~1.6GB combined RSS at idle on a warm image
# cache) shows the stack itself comfortably fits a standard GitHub Actions
# runner (2 CPU / 7GB). Three reasons, not just "startup time" (see the
# PoC README for the full account):
#   1. Tax proportionality -- only OpenSearch-security/Keycloak-org-provisioning
#      code paths need this; running it on every PR would add real minutes
#      to every contributor's feedback loop regardless of what they changed.
#   2. GHA cold-pull risk this measurement can't rule out locally -- this
#      host's ~46s figure benefits from already-cached images; a real GHA
#      runner pulls opensearchproject/opensearch (~890MB) + keycloak (~500MB)
#      + postgres/redis/minio fresh on every run, a real, not-yet-measured
#      source of both added time and Docker-Hub-rate-limit flakiness.
#   3. Matches this initiative's own established precedent (I1/H-series:
#      real local verification now, CI wiring as an explicit, scoped,
#      nightly-not-per-PR follow-up for exactly this class of heavier stack).
# Milestone RRR (docs/GAP_AUDIT_2026-08-28_MILESTONE_RRR.md): the
# schedule trigger below is CURRENTLY INERT. GitHub Actions only
# evaluates a workflow's `schedule:` trigger from the copy of this file
# on the repository's *default* branch -- a platform constraint, not
# something fixable in this YAML. This file has only ever existed on
# feat/nextgen-soc-cert-platform, confirmed never merged to main
# (`git show main:.github/workflows/security-integration-tests.yml`
# fails) -- so the nightly cron below has never actually fired, and
# won't until either a real workflow_dispatch is run against this
# branch by someone with repo access (`gh workflow run
# security-integration-tests.yml --ref feat/nextgen-soc-cert-platform`,
# or the equivalent GitHub UI/API action), or this branch merges to
# main. Every job below has been verified extensively via local
# isolated-stack dry runs (per CLAUDE.md SS F) -- that work is real and
# stands on its own -- but none of it has yet run on GitHub's actual
# infrastructure. Do not remove this comment when merging; remove it
# only once a real run (dispatch or post-merge) has actually been
# observed to succeed.
on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC -- see note above, inert until merged/dispatched
  workflow_dispatch: {}

jobs:
  security-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: .

      - name: Bring up postgres/redis/minio/opensearch/keycloak
        run: docker compose -f docker-compose.test.yml up -d postgres redis minio opensearch keycloak

      - name: Wait for base services to report healthy
        run: docker compose -f docker-compose.test.yml up -d --wait postgres redis minio opensearch keycloak

      - name: Run opensearch-init + keycloak-init (real production provisioning scripts)
        run: docker compose -f docker-compose.test.yml up opensearch-init keycloak-init

      - name: Provision the second org for the isolation proof (poc-local, not shipped)
        working-directory: poc/ci_security_enabled_stack
        env:
          KC_BASE: http://localhost:8080
        run: python3 provision_ci_org_b.py

      - name: Run the real security-enabled-stack integration tests
        working-directory: .
        env:
          KRONOS_SECURITY_STACK_KC_BASE: http://localhost:8080
          KRONOS_SECURITY_STACK_OS_BASE: https://localhost:9200
          KRONOS_SECURITY_STACK_OS_ADMIN_PASSWORD: "KronOSCiTest#2026"
        run: pytest tests/integration/test_security_enabled_stack.py -v --no-cov

      # Gap Audit Milestone GGGG (docs/GAP_AUDIT_2026-08-28_MILESTONE_GGGG.md):
      # this job never booted kronos-backend, so "both real Keycloak
      # consumers coexist" was asserted by two separate job definitions
      # that never ran against the same stack instance. db-migrate is a
      # real prerequisite (kronos-backend's own startup needs the schema
      # applied); kronos-backend itself has no compose healthcheck in this
      # file, so polled directly below (same pattern
      # frontend-e2e-smoke's own "Wait for nginx" step already uses).
      - name: Run db-migrate, then build and start kronos-backend
        run: docker compose -f docker-compose.test.yml up -d --build db-migrate kronos-backend

      - name: Wait for kronos-backend to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "kronos-backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "kronos-backend never became healthy" >&2
          exit 1

      - name: Verify kronos-backend's own Keycloak config coexists with this job's real realm (poc-local, not shipped)
        working-directory: poc/ci_security_enabled_stack
        env:
          KC_BASE: http://localhost:8080
          BACKEND_BASE: http://localhost:8000
        run: python3 verify_backend_keycloak_coexistence.py

      - name: Dump service logs on failure
        # Milestone KKK: cancelled(), not just failure() -- a
        # timeout-minutes cancellation isn't "failure" in GHA, so
        # if: failure() alone silently skips this on a timeout.
        if: failure() || cancelled()
        run: docker compose -f docker-compose.test.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  # Milestone JJJ (docs/GAP_AUDIT_2026-08-28_MILESTONE_JJJ.md) recommendation
  # #1: this profile's nginx now builds and serves the real frontend SPA
  # over genuine HTTPS (docker/Dockerfile.frontend), so a real-browser
  # smoke check is possible here for the first time -- separate job (own
  # runner, own docker-compose.test.yml project) rather than folding into
  # security-stack above, since it needs Node/Playwright tooling that job
  # has no other reason to install and a real frontend image build that
  # roughly doubles wall time.
  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    # Milestone TTT: this number was raised twice before (35->40->45)
    # without ever being re-derived from real per-step ceilings -- a
    # CI-reliability subagent review correctly called that out ("headroom
    # is asserted, not demonstrated"). Re-derived here, not just bumped
    # again: cold setup (checkout, pip install, 5 base services
    # --wait, opensearch-init/keycloak-init/db-migrate, a 3-image --build
    # with no BuildKit/GHA layer cache configured, npm ci +
    # playwright install --with-deps) has no real GHA measurement and
    # stays the dominant unbounded variable (Docker Hub pull-rate risk in
    # particular -- a fixed timeout number cannot fully protect against
    # that; the cancelled()-handling and full-log-capture below are the
    # actual mitigation for a stuck-not-just-slow run, not this number).
    # What COULD be pinned down for real: the two fault-injection specs'
    # own explicit worst-case ceilings -- evidence-upload-storage-outage
    # (test.setTimeout(120000), 2min) and evidence-parse-retry
    # (testInfo.setTimeout(420000), 7min, Celery's real max_retries=3 @
    # 30s + up to 90s OpenSearch health-wait) -- neither was previously
    # reflected in this number at all. 45 already clears a pessimistic
    # bounded-slow estimate (~20-29min: cold setup + 5 fast specs + both
    # fault specs' worst case) with real margin; raised to 55 specifically
    # to fold in the two fault specs' own 9min combined ceiling explicitly
    # rather than leave it implicit.
    #
    # Milestone UUU: celery-worker-plaso (real plaso==20260512 +
    # volatility3==2.28.0 install) is now a 4th image build in the step
    # above, and confirmed live -- not guessed -- to be the single
    # slowest build in the whole job: it alone exceeded 5 minutes on a
    # host with an already-warm Chainguard base-image cache (no measured
    # upper bound taken; the local run was backgrounded past that point).
    # Raised 55->70 to fold this in with real margin, not just because
    # a new step was added.
    #
    # Milestone XXX (CI-reliability review's own finding): the comment
    # above never accounted for evidence-upload-heavy-parser-archive.spec.ts's
    # (Milestone VVV) own declared worst-case ceilings --
    # test.setTimeout(150000) + test.setTimeout(180000) = 330s combined --
    # a real methodology regression from this comment's own established
    # practice (cite declared worst case, not typical-case measurement) for
    # the two fault-injection specs above. Restated here rather than left
    # implicit: 70min still has real margin even folding this in (330s is
    # ~5.5min against a budget already at 70, on top of the ~29min
    # pessimistic-bounded-slow baseline + 9min fault-spec ceiling +
    # >5min Plaso/Volatility build already accounted for). The new
    # evidence-upload-fast-parsers.spec.ts (Milestone XXX) needs no
    # comparable adjustment -- all 4 of its tests are real FAST-tier
    # parsers with no custom test.setTimeout, so each is bounded by
    # Playwright's own 30s per-test default, and measured live at ~7s
    # each (~28s total) against the dev stack.
    #
    # Milestone ZZZ: evidence-upload-heavy-parser-archive.spec.ts gained a
    # 3rd test (TarArchiveParser, test.setTimeout(150000)) -- the spec's
    # own combined worst-case ceiling is now 330s + 150s = 480s (8min),
    # still well inside the ~5.5min headroom this number already had.
    # Real measured cost for all 3 tests together: ~1.1min (18s + 21.5s +
    # 22.1s), against the dev stack.
    #
    # First real GHA run is still the actual confirmation -- see
    # docs/GAP_AUDIT_2026-08-28_MILESTONE_RRR.md.
    #
    # Milestone IIII: two new steps added (resilience-backend-unreachable,
    # resilience-sse-drop). Combined declared worst-case ceiling: ~60s
    # (resilience-backend-unreachable, two tests at Playwright's own 30s
    # default each, no custom test.setTimeout) + 150s
    # (resilience-sse-drop's testInfo.setTimeout(150000)) = 210s (3.5min).
    # Real measured cost against the dev stack: ~5s + ~11.6s (~17s total)
    # -- well under the declared ceiling, consistent with every other
    # fault-injection spec in this job. Still comfortably inside the ~5.5min
    # headroom Milestone ZZZ's own accounting already established.
    #
    # Milestone JJJJ: one new step (E2E: a11y, 6 tests, no custom
    # test.setTimeout -- bounded by Playwright's own 30s-per-test default,
    # 180s worst case). Real measured cost against the dev stack: ~13s
    # total (6 real page loads + axe-core scans + 2 real DetectionSeeder
    # invocations). visual-regression-pills.spec.ts (this milestone's other
    # new spec) is deliberately NOT wired into this job -- see that spec's
    # own file docstring -- so it adds no CI time at all.
    #
    # Milestone KKKK (CI-reliability review's own finding, re-derived
    # against the actual compose file rather than accepted as stated):
    # "4 image build[s]" (Milestone UUU, above) only ever counted the
    # LATER "Build and start kronos-backend, celery-worker,
    # celery-worker-plaso, ..., nginx" step. The EARLIER "opensearch-init +
    # keycloak-init + db-migrate" step also has real `build:` stanzas --
    # keycloak-init (docker/init/Dockerfile.keycloak-init, its own
    # Dockerfile, never itemized anywhere in this comment chain before
    # now) and db-migrate (docker/Dockerfile -- same Dockerfile+context as
    # kronos-backend/celery-worker, so it pays the first real cold-build
    # cost of that image; the later --build calls for kronos-backend and
    # celery-worker are then cache hits within the same job, not 3
    # independent cold builds of the same Dockerfile). Correct inventory:
    # 6 `build:` stanzas invoked in the job, across 4 distinct Dockerfiles
    # (docker/Dockerfile x3 call sites/1 real cold cost, docker/init/
    # Dockerfile.keycloak-init x1, docker/Dockerfile.plaso-worker x1 --
    # still the single slowest per Milestone UUU, docker/Dockerfile.frontend
    # x1). keycloak-init's own image has never been measured in isolation;
    # given it only installs curl/jq/bash on a slim base (see that
    # Dockerfile) it is expected to be fast relative to the app image and
    # Plaso/Volatility builds, but that is an expectation, not a
    # measurement -- flagged here rather than asserted. This does not
    # change the 70 number itself (the dominant unbounded variable was
    # already, correctly, called out above as unmeasured GHA cold-build
    # time in general, not a specific per-image count); it corrects the
    # inventory so a future reader doesn't undercount real build steps
    # when re-deriving this number.
    #
    # Milestone LLLL: one new step (case-lead-ownership-access-grant, 1
    # test, no custom test.setTimeout -- bounded by Playwright's own 30s
    # default). Real measured cost against the dev stack: ~3.4s standalone.
    # Negligible against the existing margin.
    #
    # Milestone MMMM: two new steps (case-delete-ownership-denial,
    # case-delete-ownership-grant, 1 test each, no custom test.setTimeout).
    # Real measured cost against the dev stack, run together with the rest
    # of the RBAC cluster: ~21.8s total for all 7 specs in that cluster
    # (this pair's own share is a small fraction of that). Negligible
    # against the existing margin.
    #
    # Milestone NNNN: one new step (role-change-mid-session, 1 test,
    # test.setTimeout(60000) -- 3 case creations + 2 client-side navs + a
    # real reload + a denied attempt, still a small worst-case ceiling
    # against this job's own margin). Real measured cost against the dev
    # stack: ~3.8s standalone, confirmed again inside a 6-spec RBAC-cluster
    # run (14.9s total). Negligible against the existing margin.
    #
    # Milestone OOOO: two new steps (case-member-removal-revokes-access,
    # case-member-removal-ownership-denial, 1 test each, no custom
    # test.setTimeout). Real measured cost against the dev stack: ~8.3s
    # for both together standalone, confirmed again inside a 10-spec
    # RBAC-cluster run (30.1s total). Negligible against the existing
    # margin.
    #
    # Milestone QQQQ: one new step (case-member-add-userid-validation, 1
    # test, no custom test.setTimeout). Real measured cost against the dev
    # stack: ~2.7s standalone. Negligible against the existing margin.
    #
    # Milestone RRRR: two new steps (case-members-ui, case-delete-archive-ui,
    # 1 test each, no custom test.setTimeout). Real measured cost against
    # the dev stack: both together took ~6.6s standalone, confirmed again
    # inside a 15-spec RBAC/membership/UI regression run (46.0s total).
    # Negligible against the existing margin. The a11y.spec.ts step above
    # also gained one new test (Settings tab scan) -- no separate CI step
    # needed, that whole file already runs as one step; real measured cost
    # for all 7 a11y tests together: ~16.2s.
    #
    # Milestone SSSS: no new step (extended case-delete-archive-ui's
    # existing assertions rather than adding a new one -- a real,
    # found-live cache-invalidation bug, not a new scenario). No change to
    # this number's real margin.
    #
    # Milestone TTTT: one new step (admin-quota-ui, 1 test). Unlike every
    # other step so far, its own real, demonstrated worst case is a full
    # ~30s TOTP-window wait inside a bounded retry (completeStepUpReauth's
    # own real fix for a demonstrated flakiness cause -- see the step's
    # own comment above), not just Playwright's 30s per-test default.
    # test.setTimeout(90000) reflects that explicitly. Real measured cost
    # across 4 repeated live runs: 7.3s/11.8s/28.6s/28.6s (the last two
    # took the retry path and still passed) -- still comfortably inside
    # this job's own margin even at the worst observed case.
    #
    # Milestone XXXX: one new step (admin-user-management-stepup, 2 tests,
    # each its own real step-up like admin-quota-ui above -- worst-case
    # budget is the same 90s test.setTimeout reasoning doubled across two
    # tests in one file). Real measured cost: 17.1s/28.7s standalone,
    # 1.5m total run alongside admin-quota-ui + role-change-mid-session
    # together (no interference).
    timeout-minutes: 70
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        # Milestone NNN: detection-triage.spec.ts/detection-triage-race.spec.ts
        # need this -- their DetectionSeeder fixture shells out to a real
        # Python script (frontend/e2e/fixtures/seed_detection.py) that
        # goes through the real backend domain code
        # (PostgresDetectionRepository/DetectionRiskScorer) rather than a
        # hand-written INSERT. Same install as security-stack's own step.
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: .

      - name: Point kronos.local at this runner
        # Safe here specifically because a GHA runner is a fresh VM with no
        # other stack that could ever hold a conflicting kronos.local
        # mapping -- do NOT copy this pattern for local/shared-host
        # verification (see Milestone JJJ's own README for the
        # --host-resolver-rules alternative used there instead, precisely
        # to avoid clobbering a real host's own /etc/hosts entry).
        run: echo "127.0.0.1 kronos.local" | sudo tee -a /etc/hosts

      # Gap Audit Milestone FFFF: clamav added -- real, previously-undiscovered
      # gap found investigating intake-stage retry coverage: celery-worker
      # (the service that actually calls AntivirusScanner.scan_stream(), NOT
      # kronos-backend) never set CLAMD_HOST/CLAMD_PORT in this file at all,
      # so configure_clamav_from_settings()'s dev/test-mode fallback silently
      # downgraded to the permissive NoOpScanner for this worker's whole
      # process lifetime -- meaning no file uploaded through ANY spec in this
      # job (evidence-upload.spec.ts included) was ever genuinely AV-scanned
      # before this fix, regardless of whether clamav itself was even
      # running. Fixed in docker-compose.test.yml (mirrors
      # docker-compose.dev.yml's own already-correct celery-worker values);
      # clamav listed explicitly here for the same fail-fast clarity as
      # every other base service, even though celery-worker's own new
      # `depends_on: clamav: service_healthy` would already pull it in
      # transitively.
      - name: Bring up postgres/redis/minio/opensearch/keycloak/clamav
        run: docker compose -f docker-compose.test.yml up -d --wait postgres redis minio opensearch keycloak clamav

      - name: Run opensearch-init + keycloak-init + db-migrate (real production provisioning/migration)
        run: docker compose -f docker-compose.test.yml up opensearch-init keycloak-init db-migrate

      - name: Build and start kronos-backend, celery-worker, celery-worker-plaso, tls-init, opensearch-dashboards stub, nginx (real frontend build)
        # celery-worker added Milestone MMM: the evidence-upload flow spec
        # below needs the real intake/parse pipeline, not just login.
        # celery-worker-plaso added Milestone UUU: real Plaso image
        # (docker/Dockerfile.plaso-worker, plaso==20260512 +
        # volatility3==2.28.0) -- confirmed live to be the single
        # slowest image build in this job (exceeded 5 minutes on a host
        # with an already-warm base-image cache), folded into
        # timeout-minutes below explicitly rather than left implicit.
        run: docker compose -f docker-compose.test.yml up -d --build kronos-backend celery-worker celery-worker-plaso tls-init opensearch-dashboards nginx

      # Gap Audit Milestone BBBB (CI-reliability review's own finding):
      # every other real-margin claim in this job (timeout-minutes, the
      # >5min Plaso/Volatility build time) is backed by an actual local
      # measurement; disk/memory headroom on a real GHA runner never has
      # been -- this job now does 4 image builds plus pulls 5+ more
      # (OpenSearch alone is ~2.3GB) with zero data point confirming it
      # fits. Not a fix (can't measure a real runner from here), but
      # makes sure the FIRST real GHA run captures this instead of
      # failing opaquely on ENOSPC/OOM with no diagnostic trail.
      - name: Disk/memory headroom snapshot (real GHA runner data point)
        if: always()
        run: |
          df -h
          echo "---"
          docker system df
          echo "---"
          free -h || true

      - name: Wait for nginx to serve the real frontend over HTTPS
        run: |
          for i in $(seq 1 30); do
            curl -sk -o /dev/null https://kronos.local/login && break
            sleep 2
          done
          curl -skf -o /dev/null https://kronos.local/login

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Milestone PPP: split from one bundled `npx playwright test <5 specs>`
      # step into 5 separate steps (own CI-reliability finding: a bundled
      # step means one failure's exact spec is buried in list-reporter
      # output rather than surfaced as its own red X in the job summary).
      # `if: always()` on every step after the first: without it, GHA's
      # default behavior stops the whole job at the first failing step,
      # losing information about whether the REMAINING specs would also
      # have failed -- exactly the wrong tradeoff for a job whose entire
      # purpose is diagnostic signal on a profile that's never run on a
      # real GHA runner yet. No --reporter override on any step:
      # playwright.config.ts's own configured reporters (list + html)
      # both run, so a failure gets the full HTML report (traces/
      # screenshots), not just the raw test-results/ dir a bare
      # --reporter=list would have left as the only output.
      - name: "E2E: login (smoke)"
        working-directory: frontend
        run: npx playwright test e2e/login.spec.ts

      # evidence-upload.spec.ts added Milestone MMM, the first incremental
      # flow-tier spec -- verified it needs only celery-worker (not
      # celery-worker-plaso/celery-beat/clamav) since its fixture file
      # (cloudtrail.json) is a fast-path text parser.
      - name: "E2E: evidence-upload"
        if: always()
        working-directory: frontend
        run: npx playwright test e2e/evidence-upload.spec.ts

      # evidence-upload-fast-parsers.spec.ts (Gap Audit Milestone XXX's own
      # coverage-gap finding): three straight cycles (UUU/VVV/WWW) gave
      # every HEAVY-tier (q.parse.plaso) parser real, dedicated E2E
      # coverage and left the FAST tier (q.parse.fast) -- the platform's
      # actual highest-volume real-world path -- comparatively
      # unverified. Before this, only evidence-upload.spec.ts's own
      # synthetic CloudTrail fixture had ever been driven through a real
      # top-level upload; evtx/nginx/suricata/chrome-history had either
      # never been uploaded standalone, or only ever been exercised
      # indirectly as recursively-unpacked members inside
      # kape_triage.zip (Milestone VVV), never through their own
      # independent top-level supports()/magic-byte detection. All four
      # fixtures here are real (tests/fixtures/samples/real/), same
      # celery-worker-only dependency as evidence-upload.spec.ts above
      # (all four route to q.parse.fast, never q.parse.plaso).
      - name: "E2E: evidence-upload-fast-parsers"
        if: always()
        working-directory: frontend
        run: npx playwright test e2e/evidence-upload-fast-parsers.spec.ts

      # detection-triage.spec.ts/detection-triage-race.spec.ts/
      # cross-tenant-isolation.spec.ts (Milestones NNN/OOO) need no extra
      # services (pure Postgres/OpenSearch/Keycloak-Admin-API calls) but
      # DO need the env vars below -- their Python fixture scripts
      # (frontend/e2e/fixtures/seed_detection.py, seed_second_org.py,
      # sharing config via the new frontend/e2e/fixtures/_e2e_env.py,
      # Milestone PPP) default to docker-compose.dev.yml's own Postgres
      # DSN/org-alias, a real, confirmed blocker running them against this
      # profile's different DB name/password and org alias for the first
      # time. KEYCLOAK_URL doesn't need overriding here the way it does
      # for local multi-stack-host verification (see
      # docs/GAP_AUDIT_2026-08-28_MILESTONE_NNN.md /_OOO.md) -- no
      # local-multi-stack-host collision on a real GHA runner.
      - name: "E2E: detection-triage"
        if: always()
        working-directory: frontend
        env:
          KRONOS_E2E_POSTGRES_DSN: "postgresql+asyncpg://kronos:kronos_test_password@localhost:5432/kronos_test"
          KRONOS_E2E_SEED_ORG_ALIAS: "kronos-test"
          KRONOS_E2E_PYTHON: "python3"
        run: npx playwright test e2e/detection-triage.spec.ts

      - name: "E2E: detection-triage-race"
        if: always()
        working-directory: frontend
        env:
          KRONOS_E2E_POSTGRES_DSN: "postgresql+asyncpg://kronos:kronos_test_password@localhost:5432/kronos_test"
          KRONOS_E2E_SEED_ORG_ALIAS: "kronos-test"
          KRONOS_E2E_PYTHON: "python3"
        run: npx playwright test e2e/detection-triage-race.spec.ts

      - name: "E2E: cross-tenant-isolation"
        if: always()
        working-directory: frontend
        env:
          KRONOS_E2E_PYTHON: "python3"
        run: npx playwright test e2e/cross-tenant-isolation.spec.ts

